<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1a2e">
<title>SAVE THE OCEAN — 군함 vs 잠수정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --app-w: 390px; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #04101c; overflow: hidden; overscroll-behavior: none; }
  body, #panel, .zone, #hud { touch-action: manipulation; }
  body { font-family: 'Orbitron', 'Segoe UI', system-ui, sans-serif; color: #eaf2fb; user-select: none; -webkit-user-select: none; touch-action: none; }

  #app {
    position: fixed; inset: 0; margin: 0 auto;
    width: min(100vw, 560px);
    display: flex; flex-direction: column;
    height: 100%;
  }

  /* ---------- HUD ---------- */
  #hud {
    position: relative; width: 100%; aspect-ratio: 941 / 97; flex: 0 0 auto;
    background: url(assets/hud.jpg) center / 100% 100% no-repeat;
    font-weight: 800;
  }
  #hud .hp-wrap { position: absolute; left: 13%; top: 46%; width: 18%; height: 34%; }
  #hud .hp-bar { position: absolute; inset: 0; border: 2px solid #8fb4d8; border-radius: 4px; background: #0b1d30; overflow: hidden; box-shadow: 0 0 6px #3aa0ff88 inset; }
  #hud .hp-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: linear-gradient(#8dff6a, #34c81e); box-shadow: 0 0 8px #6cff4a; transition: width .25s; }
  #hud .hp-fill.warn { background: linear-gradient(#ffd36a, #e89a1e); box-shadow: 0 0 8px #ffbb4a; }
  #hud .hp-fill.danger { background: linear-gradient(#ff7a6a, #d8281e); box-shadow: 0 0 8px #ff4a3a; }
  #hud .hp-text { position: absolute; left: 31.5%; top: 44%; height: 40%; display: flex; align-items: center; font-size: clamp(9px, 2.7vw, 15px); color: #fff; text-shadow: 0 0 6px #000; }
  #hud .score { position: absolute; left: 36%; width: 30%; top: 40%; height: 48%; display: flex; align-items: center; justify-content: center; font-size: clamp(13px, 4.3vw, 25px); color: #ffc93c; letter-spacing: .06em; text-shadow: 0 0 8px #ff9d00aa, 0 2px 0 #4b2a00; }
  #hud .bombs { position: absolute; left: 83.5%; width: 13.5%; top: 42%; height: 46%; display: flex; align-items: center; justify-content: center; gap: .15em; font-size: clamp(10px, 3.4vw, 20px); color: #fff; text-shadow: 0 0 6px #000; }
  #hud .bombs .n { color: #ffc93c; }
  #hud.drill .bombs .n { color: #ffb347; }

  /* ---------- Game canvas ---------- */
  #game-wrap { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; background: #0b3a5e; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- Control panel ---------- */
  #panel { position: relative; width: 100%; aspect-ratio: 941 / 242; flex: 0 0 auto; display: flex; align-items: stretch; background: #1b2430 url(assets/metal.jpg) center / auto 100% repeat-x; border-top: 3px solid #0a0f16; }
  /* 양손 모드(기본): 좌우 끝 + 가운데 폭탄 */
  #panel .buttons { position: relative; flex: 1 1 auto; display: flex; align-items: center; justify-content: space-between; gap: 1%; padding: 2% 1%; }
  /* 양손: 좌우 버튼이 남는 폭을 전부 채우고(터치 영역), 폭탄은 10% 크게 */
  /* 양손: 좌우 버튼 이미지를 남는 폭 전체에 늘려 채움 */
  #panel:not(.one) .buttons { gap: 1.5%; padding: 2% 1.5%; }
  #panel:not(.one) .zone.left, #panel:not(.one) .zone.right { flex: 1 1 0; max-width: none; aspect-ratio: auto; background-size: 100% 100%; }
  #panel:not(.one) .zone.bomb { height: 100%; transform: scale(1.1); }
  #panel:not(.one) .zone.bomb.pressed { transform: scale(1.02); }
  /* 한손 모드: 한쪽으로 모음 (기본 오른쪽, 좌수는 왼쪽) */
  #panel.one .buttons { justify-content: flex-end; gap: 1.5%; padding: 3% 1.5% 3% 0; }
  #panel.one.left-hand .buttons { justify-content: flex-start; padding: 3% 0 3% 1.5%; }
  .zone { position: relative; height: 100%; aspect-ratio: 164 / 148; flex: 0 1 auto; max-width: 30%; background: center / 100% 100% no-repeat; cursor: pointer; transition: transform .06s, filter .06s; }
  .zone.left  { background-image: url(assets/btn_left.png); }
  .zone.right { background-image: url(assets/btn_right.png); }
  .zone.bomb  { background-image: url(assets/btn_bomb.png); aspect-ratio: 1 / 1; height: 92%; }
  .zone.pressed { transform: scale(.94); filter: brightness(1.35) saturate(1.2); }
  /* 조작 방식 전환 (레이더 양옆) */
  .ctl { position: absolute; bottom: 2.4%; z-index: 3; height: 30px; padding: 0 10px; border-radius: 15px; border: 1px solid #7fb6e0; background: rgba(4, 22, 40, .78); color: #dbeeff; font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: .02em; cursor: pointer; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .ctl:active { filter: brightness(1.4); }
  #ctlMode { left: 8px; }
  #ctlHand { right: 8px; display: none; }
  #ctlHand.show { display: flex; }

  /* ---------- Overlays ---------- */
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; text-align: center; background: rgba(3, 14, 28, .72); backdrop-filter: blur(2px); z-index: 5; }
  .overlay.hidden { display: none; }
  /* 시작 화면: 앱 전체를 덮는 타이틀 */
  #startOverlay { position: fixed; inset: 0; margin: 0 auto; width: min(100vw, 560px); justify-content: flex-start; gap: 10px; padding: 0 16px max(12px, env(safe-area-inset-bottom)); background: #06182b url(assets/title.jpg) center top / cover no-repeat; backdrop-filter: none; z-index: 20; overflow-y: auto; }
  #startOverlay::before { content: ''; position: fixed; left: 0; right: 0; bottom: 0; height: 70%; background: linear-gradient(rgba(3,14,28,0), rgba(3,14,28,.6) 25%, rgba(3,14,28,.9)); pointer-events: none; }
  #startOverlay > * { position: relative; }
  #startOverlay .spacer { flex: 0 0 34vh; min-height: 200px; }
  #visits { position: fixed; right: 10px; top: max(8px, env(safe-area-inset-top)); z-index: 21; font-family: system-ui, sans-serif; font-size: 11px; color: #dbeeff; background: rgba(3, 14, 28, .62); border: 1px solid rgba(160,220,255,.35); border-radius: 20px; padding: 4px 10px; letter-spacing: .02em; }
  .start-btn { width: min(92%, 380px); padding: 16px 20px; border-radius: 14px; border: 3px solid #9fdcff; background: linear-gradient(#3c9cf0, #0e4f9e 60%, #0a3d7c); box-shadow: 0 6px 0 #062a55, 0 0 24px #2b9dff88, inset 0 1px 0 #cfeeff; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 14px; font-family: 'Orbitron', system-ui, sans-serif; }
  .start-btn:active { transform: translateY(5px); box-shadow: 0 1px 0 #062a55; }
  .start-btn .t1 { font-size: clamp(26px, 8.5vw, 38px); font-weight: 900; letter-spacing: .06em; text-shadow: 0 3px 0 #06305c, 0 0 12px #8fd3ff88; }
  .start-btn .arrow { font-size: 26px; color: #cfeeff; }
  #hall { width: min(92%, 380px); background: rgba(6, 22, 40, .84); border: 2px solid #ffd77a; border-radius: 14px; padding: 10px 12px 8px; box-shadow: 0 0 20px rgba(255,200,80,.25); }
  #hall h3 { margin: 0 0 4px; font-size: clamp(15px, 4.6vw, 20px); color: #ffd77a; letter-spacing: .06em; text-shadow: 0 0 10px #ffb03a88; }
  #hall .part { font-family: system-ui, sans-serif; font-size: 12px; color: #a9c3da; margin: 6px 0 2px; }
  #hall .sep { border-top: 1px dashed rgba(255,215,122,.45); margin: 8px 0 4px; }
  ul.lb { list-style: none; margin: 0; padding: 0; font-family: system-ui, sans-serif; font-size: 13px; }
  ul.lb li { display: grid; grid-template-columns: 2.6em 1fr auto auto; gap: 6px; align-items: center; padding: 4px 4px; border-top: 1px solid rgba(255,255,255,.07); }
  ul.lb li.me { background: rgba(240,180,41,.16); border-radius: 8px; }
  ul.lb .lb-rank { font-family: 'Orbitron', sans-serif; font-weight: 800; color: #8fe3ff; font-size: 12px; }
  ul.lb .lb-name { color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ul.lb .lb-score { font-family: 'Orbitron', sans-serif; font-weight: 700; color: #ffc93c; font-size: 12px; }
  ul.lb .lb-date { color: #8fa9c2; font-size: 11px; }
  ul.lb.seasons li { grid-template-columns: 3.6em auto 1fr auto; }
  .note { font-family: system-ui, sans-serif; font-size: 12px; color: #9fb9d2; padding: 4px 0; }
  .credit { font-family: system-ui, sans-serif; font-size: 11px; color: #8fa9c2; text-align: center; padding-top: 2px; }
  .btn { font-family: 'Orbitron', system-ui, sans-serif; font-weight: 800; font-size: 16px; letter-spacing: .06em; padding: 14px 28px; min-width: 200px; border: 2px solid #8fd3ff; border-radius: 10px; color: #fff; background: linear-gradient(#2a7fd8, #0f4a9a); box-shadow: 0 5px 0 #062a55, 0 0 16px #2b9dff66; cursor: pointer; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #062a55; }
  .btn.red { border-color: #ffb3aa; background: linear-gradient(#e5382a, #9c1a10); box-shadow: 0 5px 0 #4a0a05, 0 0 16px #ff4a3a66; }
  input.name { font-family: 'Orbitron', system-ui, sans-serif; font-size: 16px; text-align: center; padding: 10px 12px; width: 170px; border-radius: 8px; border: 2px solid #8fd3ff; background: #071a2e; color: #fff; letter-spacing: .08em; outline: none; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
  /* 게임 오버 */
  #overOverlay { justify-content: flex-start; padding-top: 14px; overflow-y: auto; gap: 10px; }
  #overOverlay .score-line { font-family: system-ui, sans-serif; font-size: 14px; color: #cfe3f5; }
  #recordBox { width: min(92%, 380px); background: rgba(6, 22, 40, .84); border: 2px solid #8fd3ff; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #recordBox .msg { font-family: system-ui, sans-serif; font-size: 14px; color: #fff; line-height: 1.5; }
  #recordBox .msg small { display: block; font-size: 12px; color: #a9c3da; }
  #board { width: min(92%, 380px); background: rgba(6, 22, 40, .84); border: 2px solid #ffd77a; border-radius: 12px; padding: 8px 12px; max-height: 40vh; overflow-y: auto; }
  #board h3 { margin: 0 0 4px; font-size: 15px; color: #ffd77a; letter-spacing: .06em; }
  /* 사운드 버튼 (시작 화면 위에도 보이도록) */
  #soundBtns { position: fixed; right: 8px; top: calc(min(100vw, 560px) * 0.103 + 6px); z-index: 25; display: flex; gap: 6px; }
  #soundBtns button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid #7fb6e0; background: rgba(4,22,40,.72); color: #cfe3f5; font-size: 15px; cursor: pointer; line-height: 1; }
  #soundBtns button.off { opacity: .45; text-decoration: line-through; }
  /* 공지 팝업 */
  #notice { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; background: rgba(2, 10, 20, .7); padding: 20px; }
  #notice.show { display: flex; }
  #notice .card { width: min(92%, 360px); background: linear-gradient(#0d2a48, #071a2e); border: 2px solid #8fd3ff; border-radius: 16px; padding: 18px 16px 14px; box-shadow: 0 0 30px #2b9dff66; text-align: center; }
  #notice h3 { margin: 0 0 10px; font-size: 20px; color: #ffd77a; }
  #notice .body { font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.6; color: #e6f2ff; white-space: pre-line; text-align: left; }
  #notice .foot { display: flex; flex-direction: column; gap: 8px; align-items: center; margin-top: 14px; }
  #notice label { font-family: system-ui, sans-serif; font-size: 12px; color: #a9c3da; display: flex; gap: 6px; align-items: center; }
  /* 가로 모드 안내 */
  #rotate { display: none; position: fixed; inset: 0; z-index: 50; background: #04101c; color: #cfe3f5; align-items: center; justify-content: center; text-align: center; font-family: system-ui, sans-serif; font-size: 16px; line-height: 1.7; padding: 20px; }
  @media (orientation: landscape) and (max-height: 520px) { #rotate { display: flex; } }
  #flash { position: absolute; inset: 0; pointer-events: none; background: #ff2a1a; opacity: 0; z-index: 4; }
  #toast { position: absolute; left: 50%; top: 12%; transform: translateX(-50%); padding: 6px 14px; background: rgba(0,0,0,.6); border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 6; font-family: system-ui, sans-serif; }
  #langBtn { position: fixed; left: 8px; top: calc(min(100vw, 560px) * 0.103 + 6px); z-index: 25; height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #7fb6e0; background: rgba(4,22,40,.72); color: #cfe3f5; font-family: system-ui, sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; }
  #mute { position: absolute; right: 8px; top: 8px; z-index: 6; width: 38px; height: 38px; border-radius: 50%; border: 1px solid #7fb6e0; background: rgba(4,22,40,.7); color: #cfe3f5; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
<div id="rotate">📱<br><span data-i18n="rotate">세로로 돌려주세요</span><br><small data-i18n="rotate.sub">이 게임은 세로 화면 전용입니다</small></div>
<div id="notice" role="dialog" aria-modal="true">
  <div class="card">
    <h3 id="noticeTitle"></h3>
    <div class="body" id="noticeBody"></div>
    <div class="foot">
      <button class="btn" id="noticeOk" data-i18n="notice.ok">확인</button>
      <label><input type="checkbox" id="noticeHide"> <span data-i18n="notice.hide">오늘 하루 보지 않기</span></label>
    </div>
  </div>
</div>
<div id="soundBtns">
  <button id="bgmBtn" data-i18n-label="sound.bgm" aria-label="배경음 켜기/끄기">🌊</button>
  <button id="sfxBtn" data-i18n-label="sound.sfx" aria-label="효과음 켜기/끄기">💥</button>
</div>
<button id="langBtn" data-i18n="lang">🌐 EN</button>
<div id="app">
  <div id="hud">
    <div class="hp-wrap"><div class="hp-bar"><div class="hp-fill" id="hpFill"></div></div></div>
    <div class="hp-text" id="hpText">100%</div>
    <div class="score" id="scoreText">000000</div>
    <div class="bombs"><span class="n" id="bombN">5</span><span>/</span><span id="bombMax">5</span></div>
    <div id="hudDrill" style="position:absolute; left:72.5%; top:8%; height:84%; aspect-ratio:1/1; display:none; border-radius:50%; background:#0b1a2b; box-shadow:0 0 0 1px #3a5a7a inset; overflow:hidden"><img src="assets/icon_drill.png" alt="" style="height:100%; display:block; margin:0 auto; filter: drop-shadow(0 0 3px #ffb347);"></div>
  </div>

  <div id="game-wrap">
    <canvas id="game"></canvas>
    <div id="flash"></div>
    <button class="ctl" id="ctlMode" data-i18n-label="aria.ctl" aria-label="조작 방식 전환">🤲 양손</button>
    <button class="ctl" id="ctlHand" data-i18n-label="aria.hand" aria-label="사용 손 전환">▶ 우수</button>
    <div id="toast"></div>

    <div class="overlay" id="startOverlay">
      <div id="visits" data-i18n="visits.empty">오늘 – · 누적 –</div>
      <div class="spacer"></div>
      <button class="start-btn" id="startBtn" data-i18n-label="aria.start" aria-label="작전 시작"><span class="arrow">▶</span><span class="t1" data-i18n="start">작전 시작</span></button>
      <div id="hall">
        <h3 data-i18n="hall">🏆 명예의 전당</h3>
        <div class="part" data-i18n="hall.top3">⚓ 이번 시즌 TOP 3</div>
        <div id="top3"><div class="note" data-i18n="loading">불러오는 중...</div></div>
        <div class="sep"></div>
        <div class="part" data-i18n="hall.season">👑 시즌 1위</div>
        <div id="seasons"></div>
        <div id="bestLine" class="note"></div>
      </div>
      <div class="credit">AI로 제작되었으며, 비영리로 운영됩니다.</div>
    </div>

    <div class="overlay hidden" id="overOverlay">
      <h2 data-i18n="over">침몰…</h2>
      <div class="score-line" data-i18n="over.score">이번 점수</div>
      <div class="big" id="finalScore">0</div>
      <div id="recordBox">
        <div class="msg" id="recordMsg" data-i18n="over.checking">순위 확인 중...</div>
        <div class="row" id="nameRow" style="display:none">
          <input class="name" id="nameInput" maxlength="8" data-i18n-ph="name.ph" placeholder="이름 입력" autocomplete="off" inputmode="text">
          <button class="btn" id="submitBtn" data-i18n="submit" style="min-width:90px;padding:12px 18px">등록</button>
        </div>
      </div>
      <div id="board"><h3 data-i18n="board">🏆 명예의 전당 TOP 10</h3><div id="top10"><div class="note" data-i18n="loading">불러오는 중...</div></div></div>
      <button class="btn red" id="retryBtn" data-i18n="retry">다시 하기</button>
    </div>
  </div>

  <div id="panel">
    <div class="buttons">
      <div class="zone left"  id="zLeft"  role="button" data-i18n-label="aria.left" aria-label="왼쪽으로 이동"></div>
      <div class="zone bomb"  id="zBomb"  role="button" data-i18n-label="aria.bomb" aria-label="폭탄 투하"></div>
      <div class="zone right" id="zRight" role="button" data-i18n-label="aria.right" aria-label="오른쪽으로 이동"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<script src="i18n.js?v=20260929k"></script>
<script>I18N.apply();</script>
<script src="firebase-config.js?v=20260929k"></script>
<script src="audio.js?v=20260929k"></script>
<script src="leaderboard.js?v=20260929k"></script>
<script>
  // iOS 더블탭 확대/핀치 확대 방지 (버튼 연타 시 화면이 커지는 문제)
  (function () {
    let last = 0;
    document.addEventListener('touchend', function (e) {
      const now = Date.now();
      if (now - last < 350) e.preventDefault();
      last = now;
    }, { passive: false });
    document.addEventListener('touchstart', function (e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
  })();
</script>
<script src="game.js?v=20260929k"></script>
</body>
</html>
