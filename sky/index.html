<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05030f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>스페이스 서바이버</title>
<meta property="og:title" content="스페이스 서바이버 SPACE SURVIVOR">
<meta property="og:description" content="몇 초나 버틸 수 있나요? 국기를 걸고 겨루는 우주 회피 게임">
<meta property="og:image" content="https://bluecfdc-spec.github.io/save-the-ocean/sky/title.jpg">
<style>
*,*::before,*::after{box-sizing:border-box}
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);overscroll-behavior:none;background:#05030f}
body{margin:0;overscroll-behavior:none}
[hidden]{display:none!important}
img{max-width:100%}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: 세로 한 화면. 위 = 우주 전장, 가운데 = 레이더 띠, 아래 = 조종석(조이스틱). 네온 아케이드 단일 다크 테마 */
:root{
  --void:#05030f; --panel:#0a141d; --panel-edge:#1c3340;
  --cyan:#22e6ff; --red:#ff2d6b; --amber:#ffa424; --blue:#4db8ff;
  --radar:#2bff7a; --radar-bg:#04210f; --ink:#d8f6ff; --dim:#6f9aa8;
  --display:'Orbitron','Arial Black',system-ui,sans-serif;
  --mono:'Share Tech Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--mono);overflow:hidden;
  display:flex;justify-content:center;user-select:none;-webkit-user-select:none}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;position:relative}
canvas{display:block;width:100%;height:100%}

#field{flex:1;min-height:0;position:relative;overflow:hidden}
#score{position:absolute;top:10px;left:16px;font-family:var(--display);pointer-events:none;
  text-shadow:0 0 10px var(--cyan)}
#score small{display:block;font-size:11px;letter-spacing:.18em;color:var(--cyan);font-weight:500}
#score b{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
#pause{position:absolute;top:10px;right:16px;width:40px;height:40px;border-radius:8px;
  background:rgba(10,20,29,.7);border:1.5px solid var(--cyan);color:var(--cyan);
  font:800 14px var(--display);cursor:pointer;box-shadow:0 0 10px rgba(34,230,255,.4)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

#radar{height:88px;flex:none;display:flex;align-items:stretch;gap:8px;padding:6px 16px;
  background:var(--radar-bg);border-block:2px solid var(--radar);color:var(--radar);
  box-shadow:0 0 14px rgba(43,255,122,.35) inset;font-size:10px;letter-spacing:.1em}
#radar .side{width:62px;flex:none;display:flex;flex-direction:column;justify-content:center;gap:4px}
#radar .side b{font:800 12px var(--display);border-bottom:1px solid var(--radar);padding-bottom:2px}
#radar .mid{flex:1;min-width:0}
.bars{display:flex;gap:2px;align-items:flex-end;height:14px}
.bars i{flex:1;background:var(--radar);opacity:.18}
.bars i.on{opacity:1}
#dens i:nth-child(1){height:30%}#dens i:nth-child(2){height:44%}#dens i:nth-child(3){height:58%}
#dens i:nth-child(4){height:72%}#dens i:nth-child(5){height:86%}#dens i:nth-child(6){height:100%}
#threat i{height:6px}
#threat.hot i.on{background:var(--red)}

#deck{flex:none;height:30%;min-height:190px;display:flex;align-items:center;gap:8px;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,#0e1d29,var(--panel));border-top:1px solid var(--panel-edge)}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;font-size:10px;letter-spacing:.08em;color:var(--dim)}
.col h2{margin:0;font:800 11px var(--display);color:var(--cyan);letter-spacing:.06em}
.col svg{width:44px;height:44px;margin-top:4px}
.stat{display:flex;justify-content:space-between;gap:4px;border-bottom:1px solid var(--panel-edge);padding-bottom:3px}
.stat span:last-child{color:var(--ink);font-variant-numeric:tabular-nums}
#sens{padding:9px 4px;border-radius:8px;background:#0c2a3c;border:1.5px solid var(--blue);
  color:var(--ink);font:800 11px var(--display);cursor:pointer;box-shadow:0 0 8px rgba(77,184,255,.4)}
#stick{flex:none;height:100%;max-height:190px;aspect-ratio:1;border-radius:50%;position:relative;
  border:2px solid var(--cyan);background:radial-gradient(circle,#0d3a44 0,#08212b 60%,#061219 100%);
  box-shadow:0 0 18px rgba(34,230,255,.45),0 0 18px rgba(34,230,255,.2) inset;touch-action:none;cursor:grab}
#stick::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:
   conic-gradient(from -8deg,var(--cyan) 0 16deg,transparent 0 90deg,var(--cyan) 0 106deg,transparent 0 180deg,var(--cyan) 0 196deg,transparent 0 270deg,var(--cyan) 0 286deg,transparent 0);
  -webkit-mask:radial-gradient(circle,transparent 0 70%,#000 71% 80%,transparent 81%);
          mask:radial-gradient(circle,transparent 0 70%,#000 71% 80%,transparent 81%);opacity:.8}
#knob{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#5ff3ff,#14a9bd 70%);border:2px solid var(--ink);
  box-shadow:0 0 16px var(--cyan);pointer-events:none}

#field{flex:1 1 0;touch-action:none}
#pad{flex:0 0 calc(50% - 80px);min-height:0;position:relative;overflow:hidden;touch-action:none;cursor:crosshair;
  background:
    linear-gradient(rgba(34,230,255,.09) 1px,transparent 1px) 0 0/100% 40px,
    linear-gradient(90deg,rgba(34,230,255,.09) 1px,transparent 1px) 0 0/40px 100%,
    linear-gradient(180deg,#0e1d29,var(--panel));
  box-shadow:0 0 0 1.5px var(--cyan) inset,0 0 24px rgba(34,230,255,.18) inset}
#pad .stats{position:absolute;top:8px;left:16px;right:16px;display:flex;justify-content:space-between;gap:8px;
  font-size:11px;letter-spacing:.1em;color:var(--dim);pointer-events:none}
#pad .stats b{color:var(--ink);font-weight:400;font-variant-numeric:tabular-nums}
#pad .hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;font:500 10px var(--display);
  letter-spacing:.16em;color:var(--dim);pointer-events:none}
#mark{position:absolute;left:-13px;top:-13px;width:26px;height:26px;border-radius:50%;pointer-events:none;
  border:2px solid var(--cyan);box-shadow:0 0 12px var(--cyan),0 0 8px var(--cyan) inset}
#mark::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--ink)}
#pad #stick{position:absolute;left:50%;top:50%;width:min(180px,62%);height:auto;max-height:none;
  transform:translate(-50%,-50%);pointer-events:none}
#chg{padding:11px 26px;border-radius:10px;border:1.5px solid var(--dim);background:transparent;
  color:var(--ink);font:500 13px var(--display);cursor:pointer}
#snd{position:absolute;top:10px;right:64px;width:40px;height:40px;border-radius:8px;
  background:rgba(10,20,29,.7);border:1.5px solid var(--cyan);color:var(--cyan);
  font:800 18px var(--display);cursor:pointer;box-shadow:0 0 10px rgba(34,230,255,.4)}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:9px;padding:12px 16px;text-align:center;background:rgba(5,3,15,.78);z-index:5}
#overlay h1{margin:0;font:800 26px var(--display);letter-spacing:.03em;color:var(--ink);
  text-shadow:0 0 14px var(--cyan),0 0 34px var(--red);text-wrap:balance}
#overlay p{margin:0;font-size:13px;line-height:1.5;color:var(--ink);max-width:30ch}
#overlay p em{font-style:normal;color:var(--amber)}
#overlay .big{font:800 34px var(--display);color:var(--cyan);font-variant-numeric:tabular-nums}
#pick .lbl{font:800 13px var(--display);letter-spacing:.16em;color:var(--cyan);margin-bottom:8px}
#flags{display:grid;grid-template-columns:repeat(5,44px);gap:6px 10px;justify-content:center}
#flags button{width:44px;height:44px;padding:0;border-radius:50%;border:2px solid var(--panel-edge);
  background:#0c1c28;font-size:26px;line-height:1;cursor:pointer;
  font-family:"Apple Color Emoji","Noto Color Emoji","Segoe UI Emoji",sans-serif}
#flags button[aria-pressed="true"]{border-color:var(--cyan);background:#0b3946;box-shadow:0 0 14px var(--cyan)}
#title{position:absolute;inset:0;z-index:10;background:var(--void);cursor:pointer;display:flex;align-items:center;justify-content:center}
#title img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover}
#title .fb{text-align:center;font-family:var(--display)}
#title .fb h1{font-size:30px;margin:0 0 20px;text-shadow:0 0 14px var(--cyan),0 0 34px var(--red)}
#gap{color:var(--amber)!important;font-size:15px!important}
#reg{display:flex;gap:8px;justify-content:center}
#nick{width:150px;padding:10px;border-radius:8px;border:1.5px solid var(--cyan);background:#06121a;color:var(--ink);
  font:16px var(--mono);text-align:center;user-select:text;-webkit-user-select:text}
#regB,#rankB,#bClose,#natMore{padding:10px 16px;border-radius:8px;border:1.5px solid var(--cyan);background:#0b3946;
  color:var(--ink);font:500 12px var(--display);cursor:pointer}
#rankB{border-color:var(--amber);background:transparent;color:var(--amber)}
#board{position:absolute;inset:0;z-index:8;background:rgba(5,3,15,.96);display:flex;flex-direction:column;gap:10px;
  padding:14px 16px;overflow-y:auto;touch-action:pan-y}
#board header{display:flex;justify-content:space-between;align-items:center}
#board h2{margin:0;font:800 20px var(--display);letter-spacing:.08em;text-shadow:0 0 12px var(--cyan)}
#board h3{margin:6px 0 0;font:800 12px var(--display);letter-spacing:.16em;color:var(--cyan)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:28px 30px 1fr auto;gap:8px;align-items:center;padding:7px 4px;
  border-bottom:1px solid var(--panel-edge);font-size:14px}
.row .rk{color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.row .fl{font-size:20px;line-height:1;font-family:"Apple Color Emoji","Noto Color Emoji","Segoe UI Emoji",sans-serif}
.row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm small{color:var(--dim);font-size:11px;margin-left:6px}
.row .tm{font-variant-numeric:tabular-nums;color:var(--ink)}
.row.me{background:rgba(34,230,255,.12)}
.row.first .tm,.row.first .nm{color:var(--amber)}
#natMore{align-self:center;background:transparent;border-color:var(--dim)}
#bEmpty{color:var(--dim);font-size:13px;text-align:center;padding:14px 0}
#mp{position:absolute;inset:0;z-index:8;background:rgba(5,3,15,.97);padding:14px 16px;overflow-y:auto;touch-action:pan-y}
#mpList,#mpRoom{display:flex;flex-direction:column;gap:10px}
#mp header{display:flex;justify-content:space-between;align-items:center}
#mp h2{margin:0;font:800 20px var(--display);letter-spacing:.08em;text-shadow:0 0 12px var(--cyan)}
#mp h3{margin:6px 0 0;font:800 12px var(--display);letter-spacing:.16em;color:var(--cyan)}
.mpb{padding:10px 16px;border-radius:8px;border:1.5px solid var(--cyan);background:#0b3946;color:var(--ink);font:500 12px var(--display);cursor:pointer}
.mpb:disabled{opacity:.4;cursor:default}
#mpStart{padding:14px;font-size:15px;font-weight:800}
#rooms{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#rooms button{padding:18px 8px;border-radius:10px;border:1.5px solid var(--cyan);background:#0c1c28;color:var(--ink);
  font:800 16px var(--display);cursor:pointer}
#rooms button small{display:block;margin-top:6px;font:12px var(--mono);color:var(--dim)}
#mpFlags{display:grid;grid-template-columns:repeat(5,44px);gap:8px;justify-content:center}
#mpFlags button{width:44px;height:44px;padding:0;border-radius:50%;border:2px solid var(--panel-edge);background:#0c1c28;
  font-size:24px;line-height:1;cursor:pointer;font-family:"Apple Color Emoji","Noto Color Emoji","Segoe UI Emoji",sans-serif}
#mpFlags button[aria-pressed="true"]{border-color:var(--cyan);background:#0b3946;box-shadow:0 0 14px var(--cyan)}
#mpInv{background:transparent;border-color:var(--amber);color:var(--amber);padding:12px}
#mpLink{padding:10px;border-radius:8px;border:1.5px solid var(--dim);background:#06121a;color:var(--ink);font:13px var(--mono);user-select:text;-webkit-user-select:text}
#rooms button.want{border-color:var(--amber);box-shadow:0 0 16px rgba(255,164,36,.6)}
#chat{height:118px;overflow-y:auto;border:1.5px solid var(--panel-edge);border-radius:8px;padding:8px 10px;font-size:13px;
  display:flex;flex-direction:column;gap:4px;background:#06121a;text-align:left}
#chat b{color:var(--cyan);font-weight:400}
#phr{display:flex;flex-wrap:wrap;gap:6px}
#phr button{flex:1 1 calc(50% - 6px);padding:10px 6px;border-radius:8px;border:1.5px solid var(--dim);background:#0c1c28;color:var(--ink);
  font:13px var(--mono);cursor:pointer}
#mpList{gap:7px}
#mpList h3{margin:2px 0 0}
#mpNameRow{display:flex;align-items:center;gap:10px}
#mpNameRow h3{margin:0;flex:none}
#mpNameRow #mpName{flex:1;min-width:0;width:auto;padding:8px 10px}
#mpList #rooms{gap:7px}
#mpList #rooms button{padding:10px 6px;font-size:14px}
#mpList #rooms button small{margin-top:3px}
#mp{display:flex;flex-direction:column}
#mpList{flex:1 0 auto}
#mpList #chat{flex:1 1 auto;height:auto;min-height:118px;font-size:14px}   /* 남는 세로 공간은 채팅창이 채운다 */
#mpList #phr{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:7px}   /* 두 줄의 높이를 똑같이 */
#mpList #phr button{padding:13px 2px;font-size:12.5px;line-height:1.3;word-break:keep-all}
#mpLMsg:empty{display:none}
/* 같은 국기를 고른 사람: 빨간 네온으로 표시 */
#mpPl .row.dup{border:1.5px solid var(--red);border-radius:8px;background:rgba(255,45,107,.14);
  box-shadow:0 0 12px var(--red),0 0 10px rgba(255,45,107,.45) inset;margin:4px 0;animation:dupPulse 1s ease-in-out infinite}
#mpPl .row.dup .nm,#mpPl .row.dup .tm{color:#ff6b93;text-shadow:0 0 8px var(--red)}
#mpPl .row.dup .nm small{color:#ff9db8}
#mpFlags button.dup{border-color:var(--red);box-shadow:0 0 14px var(--red),0 0 8px rgba(255,45,107,.6) inset;background:#3a0b1c}
#mpMsg.dup{color:#ff6b93;text-shadow:0 0 10px var(--red);font-size:14px}
@keyframes dupPulse{50%{box-shadow:0 0 20px var(--red),0 0 14px rgba(255,45,107,.6) inset}}
@media (prefers-reduced-motion:reduce){#mpPl .row.dup{animation:none}}
#mpMsg,#mpLMsg{color:var(--amber);font-size:13px;text-align:center;min-height:18px}
#mpName{align-self:flex-start;width:180px;padding:10px;border-radius:8px;border:1.5px solid var(--cyan);background:#06121a;color:var(--ink);
  font:16px var(--mono);user-select:text;-webkit-user-select:text}
#mpB{padding:12px 34px;min-width:210px;border-radius:10px;border:2px solid var(--amber);background:#3a2408;color:var(--ink);font:800 16px var(--display);cursor:pointer;box-shadow:0 0 18px rgba(255,164,36,.45)}
#res{display:flex;flex-direction:column;gap:4px;font-size:14px;min-width:220px}
#res div{display:flex;gap:8px;justify-content:space-between}
#res .w{color:var(--amber)}
#homeBg{position:absolute;left:0;top:0;width:100%;max-width:none;z-index:-1}
#homeBlur{position:absolute;inset:-24px;background:url(home.jpg) center/cover;filter:blur(22px) brightness(.85);z-index:-2}
#overlay.art{background:#05030f;overflow:hidden}
#overlay.home.art #go,#overlay.home.art #mpB,#overlay.home.art #rankB{position:absolute;margin:0;padding:0;min-width:0;border:0;border-radius:16px;
  background:transparent;box-shadow:none;color:transparent;font-size:0;-webkit-tap-highlight-color:transparent}
#overlay.home.art #go:active,#overlay.home.art #mpB:active,#overlay.home.art #rankB:active{background:rgba(255,255,255,.18)}
#overlay.home{background:rgba(5,3,15,.25);gap:16px}
#overlay.home #go,#overlay.home #mpB,#overlay.home #rankB{width:min(300px,82%);padding:22px 10px;border-radius:14px;border-width:2.5px;
  font:800 22px var(--display);letter-spacing:.06em}
#overlay.home #go{background:rgba(11,57,70,.92)}
#overlay.home #mpB{background:rgba(58,36,8,.92)}
#overlay.home #rankB{background:rgba(20,10,40,.92);color:var(--ink);border-color:#c77dff;box-shadow:0 0 18px rgba(199,125,255,.5)}
#spec{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:10px;white-space:nowrap;
  padding:8px 8px 8px 14px;border-radius:12px;background:rgba(5,3,15,.82);border:1.5px solid var(--amber);color:var(--amber);font-size:13px}
#specB{padding:9px 12px;border-radius:8px;border:1.5px solid var(--cyan);background:#0b3946;color:var(--ink);font:500 12px var(--display);cursor:pointer}
#homeB{padding:10px 20px;border-radius:8px;border:1.5px solid var(--dim);background:transparent;color:var(--ink);font:500 12px var(--display);cursor:pointer}
#myRec{margin:0;color:var(--amber);font-size:14px;text-align:center}
#board #reg{margin:2px 0}
#board #regMsg{margin:0;text-align:center;font-size:13px;color:var(--amber)}
#overlay #chg,#overlay #rankB,#overlay #homeB{padding:12px 34px;min-width:210px;border-radius:10px;border-width:2px;border-style:solid;font:800 16px var(--display)}
#go{margin-top:4px;padding:12px 34px;min-width:210px;border-radius:10px;border:2px solid var(--cyan);background:#0b3946;
  color:var(--ink);font:800 16px var(--display);cursor:pointer;box-shadow:0 0 18px rgba(34,230,255,.5)}
</style>

</head>
<body>
<div id="app">
  <div id="field">
    <canvas id="cv"></canvas>
    <div id="score"><small>TIME</small><b id="scoreV">0.00</b></div>
    <button id="pause" type="button" aria-label="일시정지">II</button>
    <div id="spec" hidden><span id="specT"></span><button id="specB" type="button">방으로 나가기</button></div>
    <button id="snd" type="button" aria-label="음악 켜기/끄기" aria-pressed="true">♪</button>
  </div>
  <div id="pad" aria-label="터치패드">
    <div class="stats">
      <span>BULLETS <b id="timeV">0</b></span><span>BEST <b id="bestV">0.00</b></span>
    </div>
    <div class="hint">PILOT CONTROL · TOUCH &amp; MOVE</div>
    <div id="mark" hidden></div>
  </div>
  <div id="overlay">
    <div id="homeBlur"></div>
    <img id="homeBg" src="home.jpg" alt="" onerror="this.dataset.bad=1;this.hidden=true;if(window.__home)window.__home()">
    <h1 id="ovT">SPACE SURVIVOR</h1>
    <div class="big" id="ovS" hidden>0</div>
    <p id="ovP">날아오는 미사일을 전부 피하세요.<br>몇 초를 버티는지가 기록입니다.<br>한 번 맞으면 끝입니다.</p>
    <p id="gap" hidden></p>
    <div id="pick">
      <div class="lbl">CHOOSE YOUR FLAG</div>
      <div id="flags" role="group" aria-label="국기 선택"></div>
    </div>
    <button id="go" type="button">출격</button>
    <button id="mpB" type="button">멀티플레이</button>
    <button id="chg" type="button" hidden>국가 바꾸기</button>
    <div id="res" hidden></div>
    <button id="rankB" type="button">스코어보드</button>
    <button id="homeB" type="button" hidden>처음으로</button>

  </div>
  <div id="board" hidden>
    <header><h2>SCOREBOARD</h2><button id="bClose" type="button">닫기</button></header>
    <p id="myRec" hidden></p>
    <div id="reg" hidden>
      <input id="nick" type="text" maxlength="12" placeholder="아이디 (최대 12자)" aria-label="순위판에 올릴 아이디" autocomplete="off">
      <button id="regB" type="button">기록 등록</button>
    </div>
    <p id="regMsg" hidden></p>

<script>
// 새 버전 확인: 브라우저(특히 카톡 안 브라우저)가 예전 페이지를 저장해 두고 보여주는 것을 막는다
(function(){var VER='42';try{fetch('version.txt?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():''}).then(function(t){
  t=(t||'').trim();if(t&&t!==VER&&location.search.indexOf('v='+t)<0){var q=new URLSearchParams(location.search);q.set('v',t);location.replace(location.pathname+'?'+q.toString())}}).catch(function(){})}catch(e){}})();
(function(){
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const COLORS=['#ff2d6b','#ffa424','#4db8ff'];
const M=30;                      // 화면 밖 스폰 거리 (레이더가 미리 보여주는 범위)
const SENS=[0,147,203,259];
let W=0,H=0,RW=0,RH=0,dpr=1,bg=null;
let state='ready',objs=[],pops=[],parts=[],ship,score,graze,time,spawnT,waveT,sens=2,best=0;
let tgt={x:0,y:0,on:false},keys={};
try{best=+localStorage.getItem('stargraze_best_t')||0}catch(e){}
$('bestV').textContent=best.toFixed(2);
const SHIP_V=180,LEASH=45;         // 비행기 최고 속도(px/초), 손가락이 앞서갈 수 있는 최대 거리

// 국기 선택 (5열 x 4행 = 20개국)
const FLAGS=['KR','US','JP','CN','GB','DE','FR','IT','ES','CA','AU','BR','IN','MX','ID','TR','SA','AR','ZA','RU'];
let flag='KR';
try{const f=localStorage.getItem('stargraze_flag');if(FLAGS.includes(f))flag=f}catch(e){}
function flagOf(c){return String.fromCodePoint(0x1F1A5+c.charCodeAt(0),0x1F1A5+c.charCodeAt(1))}
FLAGS.forEach(c=>{const b=document.createElement('button');b.type='button';b.id='flag-'+c;b.textContent=flagOf(c);
  b.setAttribute('aria-label',c);b.setAttribute('aria-pressed',c===flag);
  b.addEventListener('click',()=>{flag=c;try{localStorage.setItem('stargraze_flag',c)}catch(e){}
    [...$('flags').children].forEach(x=>x.setAttribute('aria-pressed',x===b))});
  $('flags').appendChild(b)});

// 국기 이모지를 따로 그려 실제 그림 영역을 재고, 그 정중앙을 쓴다 (기기마다 글자 위치가 달라 잘리는 문제 방지)
const flagCache={};
function flagImg(c){
  if(flagCache[c]!==undefined)return flagCache[c];
  const S=160,cn=document.createElement('canvas');cn.width=cn.height=S;
  const g=cn.getContext('2d',{willReadFrequently:true});
  g.font='96px "Apple Color Emoji","Noto Color Emoji","Segoe UI Emoji",sans-serif';
  g.textAlign='center';g.textBaseline='middle';g.fillStyle='#0b1540';g.fillText(flagOf(c),S/2,S/2);
  let x0=S,y0=S,x1=-1,y1=-1;
  try{const d=g.getImageData(0,0,S,S).data;
    for(let y=0;y<S;y++)for(let x=0;x<S;x++)if(d[(y*S+x)*4+3]>40){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  }catch(e){}
  return flagCache[c]=x1<0?null:{c:cn,x:x0,y:y0,w:x1-x0+1,h:y1-y0+1};
}
let level=0,spd=1,nears=[],nearT=-1,trail=[];

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;
  paintBg();
  if(ship){ship.x=Math.min(W-10,Math.max(10,ship.x));ship.y=Math.min(H-10,Math.max(10,ship.y))}
}
function paintBg(){
  bg=document.createElement('canvas');bg.width=Math.max(1,W*dpr);bg.height=Math.max(1,H*dpr);
  const g=bg.getContext('2d');g.scale(dpr,dpr);
  g.fillStyle='#05030f';g.fillRect(0,0,W,H);
  const neb=[[.25,.25,'rgba(190,40,200,.28)'],[.8,.3,'rgba(40,80,255,.26)'],[.6,.75,'rgba(120,40,220,.22)'],[.15,.6,'rgba(30,60,200,.2)']];
  for(const n of neb){const r=Math.max(W,H)*.45,gr=g.createRadialGradient(n[0]*W,n[1]*H,0,n[0]*W,n[1]*H,r);
    gr.addColorStop(0,n[2]);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,W,H)}
  for(let i=0;i<220;i++){const s=Math.random();g.fillStyle='rgba(255,255,255,'+(.25+s*.7)+')';
    g.fillRect(Math.random()*W,Math.random()*H,s>.93?2:1,s>.93?2:1)}
  // 왼쪽 아래 행성
  const pr=W*.62,px=-W*.12,py=H+pr*.62;
  const pg=g.createRadialGradient(px+pr*.3,py-pr*.6,pr*.1,px,py,pr);
  pg.addColorStop(0,'#3b4a78');pg.addColorStop(.7,'#141a3a');pg.addColorStop(1,'#070a1c');
  g.beginPath();g.arc(px,py,pr,0,7);g.fillStyle=pg;g.fill();
  g.lineWidth=3;g.strokeStyle='rgba(120,190,255,.85)';g.shadowColor='#4db8ff';g.shadowBlur=18;g.stroke();
}

function reset(){
  trail=[];nears=[];nearT=-1;patT=3;queue=[];level=0;spd=1;objs=[];pops=[];parts=[];score=0;graze=0;time=0;spawnT=.6;waveT=12;
  ship={x:W/2,y:H/2,a:-Math.PI/2,mv:0};tgt.x=ship.x;tgt.y=ship.y;
}
function rock(r){const p=[];const n=9;for(let i=0;i<n;i++)p.push(.7+Math.random()*.35);return p}
function spawn(k){
  const side=Math.random()*4|0;let x,y;
  if(side===0){x=-M;y=Math.random()*H}else if(side===1){x=W+M;y=Math.random()*H}
  else if(side===2){x=Math.random()*W;y=-M}else{x=Math.random()*W;y=H+M}
  // 나오는 순간의 비행기 위치를 겨냥. 그 뒤로는 직진만 하고 추적하지 않는다
  // 조준을 살짝 흩뜨려 한 점으로 모이지 않게 한다 (저격탄은 정확히 겨냥)
  const a=Math.atan2(ship.y-y,ship.x-x)+(k?0:(Math.random()-.5)*.7),sp=k?60*k:(60+Math.random()*80)*(.8+.2*Math.min(1,time/30));   // 초반 30초는 속도도 조금 느리게 시작
  objs.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:5,c:COLORS[Math.random()*3|0],g:false});
}
// 패턴: 한쪽에서 밀려오는 빛의 벽, 빈틈 하나. 레이더에 먼저 찍힌다.
function wall(){
  const side=Math.random()*4|0,horiz=side<2,len=horiz?H:W,step=44,n=Math.ceil(len/step)+1;
  const gap=1+(Math.random()*(n-4)|0),sp=105+Math.min(1,time/90)*60;
  for(let i=0;i<n;i++){
    if(i>=gap&&i<gap+3)continue;
    const p=i*step;let x,y,vx=0,vy=0;
    if(side===0){x=-M;y=p;vx=sp}else if(side===1){x=W+M;y=p;vx=-sp}
    else if(side===2){x=p;y=-M;vy=sp}else{x=p;y=H+M;vy=-sp}
    objs.push({x,y,vx,vy,r:5,c:'#ffa424',g:false});
  }
}

// 탄막 패턴: 겨냥탄만 있으면 살짝만 움직여도 다 피해져 밋밋하다. 길을 막는 탄 + 계속 움직이게 하는 탄을 섞는다
let patT=5,queue=[];
function edgePt(){const s=Math.random()*4|0;
  return s===0?[-M,Math.random()*H]:s===1?[W+M,Math.random()*H]:s===2?[Math.random()*W,-M]:[Math.random()*W,H+M]}
function shot(x,y,a,sp,c){objs.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:5,c,g:false})}
function pattern(){
  const p=edgePt(),x=p[0],y=p[1],c=COLORS[Math.random()*3|0],a=Math.atan2(ship.y-y,ship.x-x),k=Math.random()*4|0;
  if(k===0){for(let i=-2;i<=2;i++)shot(x,y,a+i*.2,78,c)}                       // 부채꼴 5발
  else if(k===1){for(let i=0;i<6;i++)queue.push({t:i*.22,f:()=>shot(x,y,Math.atan2(ship.y-y,ship.x-x),105,c)})} // 연사 6발: 쏠 때마다 다시 겨냥
  else if(k===2){const o=Math.random();for(let i=0;i<14;i++)shot(x,y,o+i/14*6.283,62,c)} // 원형 퍼짐
  else{const x2=W-x,y2=H-y;for(let i=-1;i<=1;i++){shot(x,y,a+i*.24,74,c);shot(x2,y2,Math.atan2(ship.y-y2,ship.x-x2)+i*.24,74,c)}} // 양쪽 협공
}
function update(dt){
  time+=dt;
  if(mp.on)mpTick(dt);else updateCpus(dt);
  // 닷지 방식: 비행기에 최고 속도가 있다. 손가락은 목표점만 옮기고, 비행기는 SHIP_V 로 따라간다
  let ix=0,iy=0;
  if(keys.ArrowLeft||keys.a)ix-=1;if(keys.ArrowRight||keys.d)ix+=1;
  if(keys.ArrowUp||keys.w)iy-=1;if(keys.ArrowDown||keys.s)iy+=1;
  const m=Math.hypot(ix,iy);
  if(m>0){ship.x+=ix/m*SHIP_V*dt;ship.y+=iy/m*SHIP_V*dt;tgt.x=ship.x;tgt.y=ship.y}
  else{
    const dx=tgt.x-ship.x,dy=tgt.y-ship.y,d=Math.hypot(dx,dy),cap=SHIP_V*dt;
    if(d<=cap){ship.x=tgt.x;ship.y=tgt.y}else{ship.x+=dx/d*cap;ship.y+=dy/d*cap}
  }
  ship.x=Math.min(W-10,Math.max(10,ship.x));ship.y=Math.min(H-10,Math.max(10,ship.y));

  trail.push({x:ship.x,y:ship.y});if(trail.length>32)trail.shift();   // 지나온 길 (흰 꼬리)
  // 화면의 탄 수를 일정하게 유지: 30발로 시작해 1초에 1.5발씩 늘고, 나간 만큼 바로 다시 들어온다
  const t2=time-1.5;   // 시작 1.5초는 빈 화면, 그 뒤 2초에 걸쳐 30발까지 채우고 이후 1초에 1.5발씩 는다
  const K=H/((H+$('pad').clientHeight)/2);   // 전장이 넓어진 비율만큼 탄 수를 늘려 밀도를 유지
  // 난이도 곡선: 1.5초 여유 → 6발로 시작 → 30초에 30발(예전 시작 수준) → 이후 1초에 1.5발씩 늘어 90초에 최대 120발
  const base=t2<0?0:time<30?Math.min(6+24*t2/28.5,t2*8):Math.min(120,30+(time-30)*1.5);
  const want=K*base;
  for(let i=0;i<4&&objs.length<want;i++)spawn();
  const lv=Math.floor(time/30);
  Music.tempo(Math.min(2,lv));               // 30초, 60초를 넘기면 음악이 한 단계씩 빨라진다
  if(lv>level){level=lv;spawn(6)} // 30초마다 저격탄 한 발

  let near=1e9;
  for(let i=objs.length-1;i>=0;i--){
    const o=objs[i];o.x+=o.vx*spd*dt;o.y+=o.vy*spd*dt;
    if(o.x<-M-80||o.x>W+M+80||o.y<-M-80||o.y>H+M+80){objs.splice(i,1);continue}
    const d=Math.hypot(o.x-ship.x,o.y-ship.y),hit=(o.rock?o.r*.85:o.r)+5;
    if(d-hit<near)near=d-hit;
    if(d<hit){die();return}
    if(!o.g&&d<hit+12){o.g=true;if(time-nearT>.1){nearT=time;nears.push({t:0,a:Math.atan2(o.y-ship.y,o.x-ship.x),c:o.c});Music.blip()}} // 스침: 점수 없이 연출만
  }
  for(let i=pops.length-1;i>=0;i--){pops[i].t+=dt;if(pops[i].t>.8)pops.splice(i,1)}
  hud(near);
}
function hud(near){
  $('scoreV').textContent=time.toFixed(2);
  $('timeV').textContent=objs.length;
}
function die(){
  state='over';Music.stop();
  boom(ship.x,ship.y);
  if(mp.on){mpDied();return}
  const fin=Math.round(time*100)/100;
  const rec=fin>best;if(rec){best=fin;try{localStorage.setItem('stargraze_best_t',best)}catch(e){}}
  $('bestV').textContent=best.toFixed(2);$('scoreV').textContent=fin.toFixed(2);
  setTimeout(()=>{if(state!=='over')return;
    $('ovT').textContent='GAME OVER';$('ovS').hidden=false;$('ovS').textContent=fin.toFixed(2)+'초';
    $('ovP').innerHTML=(rec?'<em>신기록!</em><br>':'')+'최고 기록 '+best.toFixed(2)+'초';
    $('gap').hidden=true;try{showGap(fin);sendNation(fin)}catch(e){}
    if(db&&fin>mySent){pending=fin;if(myName)submit(fin)}   // 아이디가 없으면 스코어보드에 들어가서 직접 등록
    plain();$('ovP').hidden=false;$('res').hidden=true;$('pick').hidden=true;$('chg').hidden=false;$('go').hidden=false;$('go').textContent='바로 시작';
    $('rankB').hidden=false;$('mpB').hidden=true;$('homeB').hidden=false;$('homeB').textContent='처음으로';$('overlay').hidden=false},650);
}

function draw(dt){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(shakeT>0){shakeT-=dt;const q=shakeT/.3*9;ctx.fillStyle='#05030f';ctx.fillRect(0,0,W,H);ctx.translate((Math.random()-.5)*q,(Math.random()-.5)*q)}
  if(bg)ctx.drawImage(bg,0,0,W,H);
  ctx.lineCap='round';
  for(const o of objs){
    if(o.rock){
      ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);ctx.beginPath();
      o.rock.forEach((k,i)=>{const a=i/o.rock.length*Math.PI*2;ctx[i?'lineTo':'moveTo'](Math.cos(a)*o.r*k,Math.sin(a)*o.r*k)});
      ctx.closePath();ctx.fillStyle='#2a2630';ctx.fill();ctx.strokeStyle='#8a8594';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();
    }else{
      ctx.fillStyle=o.c;ctx.shadowColor=o.c;ctx.shadowBlur=12;
      ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,7);ctx.fill();
      ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(o.x,o.y,2.2,0,7);ctx.fill();
    }
  }
  if(trail.length>1&&state!=='over'){
    ctx.lineCap='round';ctx.strokeStyle='#ffffff';ctx.shadowColor='#ffffff';ctx.shadowBlur=10;
    for(let i=1;i<trail.length;i++){const k=i/trail.length;ctx.globalAlpha=k*k*.6;ctx.lineWidth=1+k*6;
      ctx.beginPath();ctx.moveTo(trail[i-1].x,trail[i-1].y);ctx.lineTo(trail[i].x,trail[i].y);ctx.stroke()}
    ctx.globalAlpha=1;ctx.shadowBlur=0;
  }
  drawRivals(dt);
  if(ship&&state!=='over')drawPlane(ship.x,ship.y,flag,1);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.t>.9){parts.splice(i,1);continue}
    ctx.globalAlpha=1-p.t/.9;ctx.fillStyle=p.c;const z=p.s||4;ctx.fillRect(p.x-z/2,p.y-z/2,z,z)}
  for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.t+=dt;if(r.t>.55){rings.splice(i,1);continue}if(r.t<0)continue;
    const k=r.t/.55;ctx.globalAlpha=(1-k)*.9;ctx.strokeStyle=k<.3?'#ffffff':'#ffa424';ctx.lineWidth=7*(1-k)+1;
    ctx.beginPath();ctx.arc(r.x,r.y,8+k*r.m,0,7);ctx.stroke();
    if(k<.18){ctx.globalAlpha=(.18-k)/.18*.8;ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(r.x,r.y,26,0,7);ctx.fill()}}
  ctx.globalAlpha=1;
  for(let i=nears.length-1;i>=0;i--){const n=nears[i];n.t+=dt;if(n.t>.25||!ship){nears.splice(i,1);continue}
    const k=n.t/.25;ctx.globalAlpha=1-k;ctx.strokeStyle=n.c;ctx.lineWidth=3.5-k*2;ctx.shadowColor=n.c;ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(ship.x,ship.y,12+k*12,n.a-.85,n.a+.85);ctx.stroke();ctx.shadowBlur=0}   // 스친 쪽에만, 그 미사일 색으로 뜨는 반달
  ctx.globalAlpha=1;
  ctx.textAlign='center';ctx.font='800 20px Orbitron, Arial Black, sans-serif';
  for(const p of pops){const k=p.t/.8;ctx.globalAlpha=1-k;ctx.fillStyle='#d8f6ff';ctx.shadowColor='#22e6ff';ctx.shadowBlur=12;
    ctx.fillText(p.s||'+100',p.x,p.y-k*26);
    ctx.shadowBlur=0;ctx.strokeStyle='#22e6ff';ctx.lineWidth=1.5;
    for(let j=0;j<12;j++){const a=j/12*Math.PI*2,r1=30+k*14,r2=r1+6;ctx.beginPath();
      ctx.moveTo(p.x+Math.cos(a)*r1*1.3,p.y-7-k*26+Math.sin(a)*r1*.7);ctx.lineTo(p.x+Math.cos(a)*r2*1.3,p.y-7-k*26+Math.sin(a)*r2*.7);ctx.stroke()}}
  ctx.globalAlpha=1;
  if(state==='count'&&countN>0){const z=96+countF*70;   // 숫자가 크게 나타났다가 줄어들며 다음 숫자로
    ctx.font='800 '+z+'px Orbitron, Arial Black, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.globalAlpha=.35+.65*Math.min(1,countF*2.2);ctx.fillStyle=countN===1?'#ff2d6b':'#d8f6ff';
    ctx.shadowColor=countN===1?'#ff2d6b':'#22e6ff';ctx.shadowBlur=24*dpr;ctx.fillText(countN,W/2,H/2);
    ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.textBaseline='alphabetic'}
}
// 국기 점 기체 (방향 없음). al<1 이면 반투명한 경쟁자
function drawPlane(x,y,f,al){
  ctx.save();ctx.globalAlpha=al;ctx.translate(Math.round(x),Math.round(y));
  const mine=al===1;   // 내 비행기만 형광 초록 테두리. 바깥 크기(반지름 9)와 판정은 그대로, 테두리는 안쪽으로 2px

    dieAt:15*(i+1),wx:W/2,wy:H/2,wt:0}));

function updateCpus(dt){
  for(const r of rivals){
    if(!r.cpu||!r.alive)continue;

    r.wt-=dt;if(r.wt<=0){r.wt=.8+Math.random()*1.5;r.wx=W*(.1+Math.random()*.8);r.wy=H*(.1+Math.random()*.8)}

  const k=Math.max(w/IW,Math.min(h/IH,w/(IW*.86))),ox=(w-IW*k)/2,oy=(h-IH*k)/2,b=$('homeBg').style;

// lobby/pres/{기기ID} true   lobby/chat/{자동ID} {n:아이디, p:문구 번호, t:시각}
const PHR=['한 판 하자!','나랑 같이 할 사람?','화성방으로 와','수성방으로 와','목성방으로 와','지구방으로 와','ㅋㅋㅋ','잘했다!'];
let chatOn=false,lastSay=0;
function lobbyOn(){
  if(!rtdb||chatOn)return;chatOn=true;
  const pr=rtdb.ref('lobby/pres/'+myId);pr.onDisconnect().remove();pr.set(true);
  rtdb.ref('lobby/pres').on('value',s=>{$('mpOn').textContent='지금 멀티플레이에 '+s.numChildren()+'명'},()=>{});
  $('chat').textContent='';
  rtdb.ref('lobby/chat').limitToLast(20).on('child_added',s=>{
    const v=s.val()||{};if(typeof v.p!=='number'||!PHR[v.p])return;
    const d=document.createElement('div'),b=document.createElement('b');b.textContent=String(v.n||'').slice(0,12)+'  ';
    d.appendChild(b);d.appendChild(document.createTextNode(PHR[v.p]));
    const c=$('chat');c.appendChild(d);while(c.children.length>30)c.removeChild(c.firstChild);c.scrollTop=c.scrollHeight;
  },()=>{});
  // 10분 넘은 말은 지운다 (쌓이지 않게)
  rtdb.ref('lobby/chat').orderByChild('t').endAt(Date.now()+mp.off-600000).limitToFirst(20).once('value')
    .then(s=>{s.forEach(c=>{c.ref.remove()})}).catch(()=>{});
}
function lobbyOff(keepPres){
  if(!rtdb||!chatOn)return;chatOn=false;rtdb.ref('lobby/pres').off();rtdb.ref('lobby/chat').off();
  if(!keepPres)dropPres();
}
function dropPres(){if(!rtdb)return;const pr=rtdb.ref('lobby/pres/'+myId);pr.onDisconnect().cancel();pr.remove()}
PHR.forEach((t,i)=>{const b=document.createElement('button');b.type='button';b.textContent=t;
  b.addEventListener('click',()=>{
    if(!rtdb){return}
    const n=$('mpName').value.trim().slice(0,12);
    if(!n){$('mpLMsg').textContent='아이디를 먼저 입력해 주세요.';$('mpName').focus();return}
    if(Date.now()-lastSay<2000){$('mpLMsg').textContent='조금 천천히 보내 주세요.';return}
    lastSay=Date.now();$('mpLMsg').textContent='';myName=n;try{localStorage.setItem('ss_name',n)}catch(e){}
    rtdb.ref('lobby/chat').push({n:n,p:i,t:firebase.database.ServerValue.TIMESTAMP}).catch(()=>{$('mpLMsg').textContent='보내지 못했습니다.'});
  });$('phr').appendChild(b)});

function mpCloseList(){clearInterval(mp.listT);lobbyOff(false);if(rtdb)setTimeout(()=>{if(!mp.on&&$('mp').hidden)rtdb.goOffline()},600);$('mp').hidden=true}
function joinRoom(id){
  if(!rtdb)return;
  const n=$('mpName').value.trim().slice(0,12);
  if(!n){$('mpLMsg').textContent='아이디를 먼저 입력해 주세요.';$('mpName').focus();return}
  myName=n;try{localStorage.setItem('ss_name',n)}catch(e){}
  const ref=rtdb.ref('rooms/'+id);
  ref.once('value').then(s=>{
    const v=s.val()||{},pl=v.players||{},cnt=Object.keys(pl).length;
    if(cnt>=5&&!pl[myId]){$('mpLMsg').textContent='방이 가득 찼습니다.';return}
    if(cnt>0&&(v.meta||{}).state==='play'){$('mpLMsg').textContent='게임 중인 방입니다. 끝난 뒤에 들어갈 수 있습니다.';return}
    clearInterval(mp.listT);lobbyOff(true);
    mp.on=true;mp.room=id;mp.ref=ref;mp.players={};mp.meta={};mp.ended=true;mp.round=(v.meta||{}).round||0;
    if(cnt===0)ref.child('meta').set({state:'lobby',round:mp.round,startAt:0});
    const me=ref.child('players/'+myId);
    me.onDisconnect().remove();ref.child('pos/'+myId).onDisconnect().remove();
    me.set({name:myName,flag:'',joined:firebase.database.ServerValue.TIMESTAMP,alive:false,t:0});
    ref.child('players').on('value',mpOnPlayers);ref.child('meta').on('value',mpOnMeta);
    ref.child('pos').on('child_added',mpOnPos);ref.child('pos').on('child_changed',mpOnPos);
    state='ready';rivals=[];$('overlay').hidden=true;showRoom();
  }).catch(()=>{$('mpLMsg').textContent='방에 들어가지 못했습니다. 잠시 뒤 다시 시도해 주세요.'});
}

function sorted(){return Object.keys(mp.players).sort((a,b)=>(mp.players[a].joined||0)-(mp.players[b].joined||0)||(a<b?-1:1))}

function mpOnMeta(s){

  $('rankB').hidden=true;$('mpB').hidden=true;$('go').hidden=false;$('go').textContent='방으로 돌아가기';

});
$('mpLink').addEventListener('keydown',e=>e.stopPropagation());
// 초대 링크(?room=방이름)로 들어온 경우: 아이디가 있으면 바로 입장, 없으면 아이디만 넣게 한다
let wantRoom='';try{const r=new URLSearchParams(location.search).get('room');if(ROOMS.some(x=>x[0]===r))wantRoom=r}catch(e){}
function enterInvited(){
  if(!wantRoom)return;
  mpOpen();if(!rtdb)return;
  $('room-'+wantRoom).classList.add('want');
  const name=ROOMS.find(r=>r[0]===wantRoom)[1];
  if(myName)joinRoom(wantRoom);
  else $('mpLMsg').textContent='초대받은 방은 '+name+' 입니다. 아이디를 넣고 그 방을 눌러 주세요.';
  wantRoom='';
}
$('specB').addEventListener('click',()=>{mp.view='room';$('spec').hidden=true;showRoom()});
$('mpB').addEventListener('click',mpOpen);
$('mpClose').addEventListener('click',mpCloseList);
$('mpLeave').addEventListener('click',mpLeave);
$('mpStart').addEventListener('click',mpStartClick);
$('mpName').addEventListener('keydown',e=>e.stopPropagation());
$('mpName').addEventListener('keyup',e=>e.stopPropagation());

// 인앱 브라우저에서 드래그가 창을 끌어내리지 않게: 순위판과 입력칸 밖의 터치 이동은 브라우저에 넘기지 않는다
document.addEventListener('touchmove',e=>{if(!e.target.closest('#board,#mp')&&e.target.tagName!=='INPUT')e.preventDefault()},{passive:false});
$('pad').addEventListener('touchstart',e=>e.preventDefault(),{passive:false});

// 버튼 선택음: 모든 버튼에서 종소리. 게임을 바로 시작하는 출격/바로 시작 버튼만 빼고(거기는 출격음이 난다)
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  const launching=b.id==='go'&&!$('overlay').classList.contains('home')&&state!=='paused'&&!mp.on;
  if(!launching)Music.chime()},true);
resize();reset();
homeScreen();window.__home=()=>{if($('overlay').classList.contains('home'))homeScreen()};
try{enterInvited()}catch(e){}
// 시작 화면 뒤에 보이는 예시 전장
for(let i=0;i<26;i++){spawn();const o=objs[objs.length-1];const k=1.5+Math.random()*3;o.x+=o.vx*k;o.y+=o.vy*k}
requestAnimationFrame(frame);
})();
</script>
