<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1a2e">
<title>SAVE THE OCEAN: DEPTH WAR</title>
<link href="vendor/fonts/orbitron.css" rel="stylesheet">
<style>
  :root { --app-w: min(100vw, 560px); }  /* 실제 값은 game.js resize() 가 정함 */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #04101c; overflow: hidden; overscroll-behavior: none; }
  body, #panel, .zone, #hud { touch-action: manipulation; }
  body { font-family: 'Orbitron', 'Segoe UI', system-ui, sans-serif; color: #eaf2fb; user-select: none; -webkit-user-select: none; touch-action: none; }

  #app {
    position: fixed; inset: 0; margin: 0 auto;
    width: var(--app-w);
    display: flex; flex-direction: column;
    height: 100%;
  }

  /* ---------- HUD ---------- */
  #hud {
    position: relative; width: 100%; aspect-ratio: 941 / 97; flex: 0 0 auto;
    background: url(assets/hud.jpg) center / 100% 100% no-repeat;
    font-weight: 800;
  }
  #hud .hp-wrap { position: absolute; left: 13%; top: 46%; width: 18%; height: 34%; }
  #hud .hp-bar { position: absolute; inset: 0; border: 2px solid #8fb4d8; border-radius: 4px; background: #0b1d30; overflow: hidden; box-shadow: 0 0 6px #3aa0ff88 inset; }
  #hud .hp-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: linear-gradient(#8dff6a, #34c81e); box-shadow: 0 0 8px #6cff4a; transition: width .25s; }
  #hud .hp-fill.warn { background: linear-gradient(#ffd36a, #e89a1e); box-shadow: 0 0 8px #ffbb4a; }
  #hud .hp-fill.danger { background: linear-gradient(#ff7a6a, #d8281e); box-shadow: 0 0 8px #ff4a3a; }
  #hud .hp-text { position: absolute; left: 31.5%; top: 44%; height: 40%; display: flex; align-items: center; font-size: clamp(9px, calc(var(--app-w) * 0.027), 15px); color: #fff; text-shadow: 0 0 6px #000; }
  #hud .score { position: absolute; left: 38%; width: 28%; top: 40%; height: 48%; display: flex; align-items: center; justify-content: center; font-size: clamp(13px, calc(var(--app-w) * 0.043), 25px); color: #ffc93c; letter-spacing: .06em; text-shadow: 0 0 8px #ff9d00aa, 0 2px 0 #4b2a00; }
  #hud .bombs { position: absolute; left: 83.5%; width: 13.5%; top: 42%; height: 46%; display: flex; align-items: center; justify-content: center; gap: .15em; font-size: clamp(10px, calc(var(--app-w) * 0.034), 20px); color: #fff; text-shadow: 0 0 6px #000; }
  #hud .bombs .n { color: #ffc93c; }
  #hud.drill .bombs .n { color: #ffb347; }

  /* ---------- Game canvas ---------- */
  #game-wrap { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; background: #0b3a5e; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- Control panel ---------- */
  #panel { position: relative; width: 100%; aspect-ratio: 941 / 242; flex: 0 0 auto; display: flex; align-items: stretch; background: #1b2430 url(assets/metal.jpg) center / auto 100% repeat-x; border-top: 3px solid #0a0f16; }
  /* 양손 모드(기본): 좌우 끝 + 가운데 폭탄 */
  #panel .buttons { position: relative; flex: 1 1 auto; display: flex; align-items: center; justify-content: space-between; gap: 1%; padding: 2% 1%; }
  /* 양손: 좌우 버튼이 남는 폭을 전부 채우고(터치 영역), 폭탄은 10% 크게 */
  /* 양손: 좌우 버튼 이미지를 남는 폭 전체에 늘려 채움 */
  #panel:not(.one) .buttons { gap: 1.5%; padding: 2% 1.5%; }
  #panel:not(.one) .zone.left, #panel:not(.one) .zone.right { flex: 1 1 0; max-width: none; aspect-ratio: auto; background-size: 100% 100%; }
  #panel:not(.one) .zone.bomb { height: 100%; transform: scale(1.1); }
  #panel:not(.one) .zone.bomb.pressed { transform: scale(1.02); }
  /* 한손 모드: 한쪽으로 모음 (기본 오른쪽, 좌수는 왼쪽) */
  #panel.one .buttons { justify-content: flex-end; gap: 1.5%; padding: 3% 1.5% 3% 0; }
  #panel.one.left-hand .buttons { justify-content: flex-start; padding: 3% 0 3% 1.5%; }
  .zone { position: relative; height: 100%; aspect-ratio: 164 / 148; flex: 0 1 auto; max-width: 30%; background: center / 100% 100% no-repeat; cursor: pointer; transition: transform .06s, filter .06s; }
  .zone.left  { background-image: url(assets/btn_left.png); }
  .zone.right { background-image: url(assets/btn_right.png); }
  .zone.bomb  { background-image: url(assets/btn_bomb.png); aspect-ratio: 1 / 1; height: 92%; }
  .zone.pressed { transform: scale(.94); filter: brightness(1.35) saturate(1.2); }
  /* 조작 방식 전환 (레이더 양옆) */
  .ctl { position: absolute; bottom: 2.4%; z-index: 3; height: 30px; padding: 0 10px; border-radius: 15px; border: 1px solid #7fb6e0; background: rgba(4, 22, 40, .78); color: #dbeeff; font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: .02em; cursor: pointer; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .ctl:active { filter: brightness(1.4); }
  #ctlMode { left: 8px; }
  #ctlHand { right: 8px; display: none; }
  #ctlHand.show { display: flex; }

  /* ---------- Overlays ---------- */
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; text-align: center; background: rgba(3, 14, 28, .72); backdrop-filter: blur(2px); z-index: 5; }
  .overlay.hidden { display: none; }
  /* 시작 화면: 앱 전체를 덮는 타이틀 */
  #startOverlay { position: fixed; inset: 0; margin: 0 auto; width: var(--app-w); justify-content: flex-start; gap: 10px; padding: 0 16px max(12px, env(safe-area-inset-bottom)); background: #06182b url(assets/title.jpg) center top / cover no-repeat; backdrop-filter: none; z-index: 20; overflow-y: auto; }
  #startOverlay::before { content: ''; position: fixed; left: 0; right: 0; bottom: 0; height: 70%; background: linear-gradient(rgba(3,14,28,0), rgba(3,14,28,.6) 25%, rgba(3,14,28,.9)); pointer-events: none; }
  #startOverlay > * { position: relative; }
  #startOverlay .spacer { flex: 0 0 34vh; min-height: 200px; }
  #visits { position: fixed; right: 10px; top: max(8px, env(safe-area-inset-top)); z-index: 21; font-family: system-ui, sans-serif; font-size: 11px; color: #dbeeff; background: rgba(3, 14, 28, .62); border: 1px solid rgba(160,220,255,.35); border-radius: 20px; padding: 4px 10px; letter-spacing: .02em; }
  .start-btn { width: min(92%, 380px); padding: 16px 20px; border-radius: 14px; border: 3px solid #9fdcff; background: linear-gradient(#3c9cf0, #0e4f9e 60%, #0a3d7c); box-shadow: 0 6px 0 #062a55, 0 0 24px #2b9dff88, inset 0 1px 0 #cfeeff; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 14px; font-family: 'Orbitron', system-ui, sans-serif; }
  .start-btn:active { transform: translateY(5px); box-shadow: 0 1px 0 #062a55; }
  .start-btn .t1 { font-size: clamp(26px, calc(var(--app-w) * 0.085), 38px); font-weight: 900; letter-spacing: .06em; text-shadow: 0 3px 0 #06305c, 0 0 12px #8fd3ff88; }
  .start-btn .arrow { font-size: 26px; color: #cfeeff; }
  #hall { width: min(92%, 380px); background: rgba(6, 22, 40, .84); border: 2px solid #ffd77a; border-radius: 14px; padding: 10px 12px 8px; box-shadow: 0 0 20px rgba(255,200,80,.25); }
  #hall h3 { margin: 0 0 4px; font-size: clamp(15px, calc(var(--app-w) * 0.046), 20px); color: #ffd77a; letter-spacing: .06em; text-shadow: 0 0 10px #ffb03a88; }
  #hall .part { font-family: system-ui, sans-serif; font-size: 12px; color: #a9c3da; margin: 6px 0 2px; }
  #hall .sep { border-top: 1px dashed rgba(255,215,122,.45); margin: 8px 0 4px; }
  ul.lb { list-style: none; margin: 0; padding: 0; font-family: system-ui, sans-serif; font-size: 13px; }
  ul.lb li { display: grid; grid-template-columns: 2.6em 1fr auto auto; gap: 6px; align-items: center; padding: 4px 4px; border-top: 1px solid rgba(255,255,255,.07); }
  ul.lb li.me { background: rgba(240,180,41,.16); border-radius: 8px; }
  ul.lb .lb-rank { font-family: 'Orbitron', sans-serif; font-weight: 800; color: #8fe3ff; font-size: 12px; }
  ul.lb .lb-name { color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ul.lb .lb-score { font-family: 'Orbitron', sans-serif; font-weight: 700; color: #ffc93c; font-size: 12px; }
  ul.lb .lb-date { color: #8fa9c2; font-size: 11px; }
  ul.lb.seasons li { grid-template-columns: 3.6em auto 1fr auto; }
  .note { font-family: system-ui, sans-serif; font-size: 12px; color: #9fb9d2; padding: 4px 0; }
  .credit { font-family: system-ui, sans-serif; font-size: 11px; color: #8fa9c2; text-align: center; padding-top: 2px; }
  .btn { font-family: 'Orbitron', system-ui, sans-serif; font-weight: 800; font-size: 16px; letter-spacing: .06em; padding: 14px 28px; min-width: 200px; border: 2px solid #8fd3ff; border-radius: 10px; color: #fff; background: linear-gradient(#2a7fd8, #0f4a9a); box-shadow: 0 5px 0 #062a55, 0 0 16px #2b9dff66; cursor: pointer; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #062a55; }
  .btn.red { border-color: #ffb3aa; background: linear-gradient(#e5382a, #9c1a10); box-shadow: 0 5px 0 #4a0a05, 0 0 16px #ff4a3a66; }
  input.name { font-family: 'Orbitron', system-ui, sans-serif; font-size: 16px; text-align: center; padding: 10px 12px; width: 170px; border-radius: 8px; border: 2px solid #8fd3ff; background: #071a2e; color: #fff; letter-spacing: .08em; outline: none; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
  /* 게임 오버 */
  #overOverlay { justify-content: flex-start; touch-action: pan-y; padding-top: 14px; overflow-y: auto; gap: 10px; }
  #overOverlay .score-line { font-family: system-ui, sans-serif; font-size: 14px; color: #cfe3f5; }
  #recordBox { width: min(92%, 380px); background: rgba(6, 22, 40, .84); border: 2px solid #8fd3ff; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #recordBox .msg { font-family: system-ui, sans-serif; font-size: 14px; color: #fff; line-height: 1.5; }
  #recordBox .msg small { display: block; font-size: 12px; color: #a9c3da; }
  #board { width: min(92%, 380px); background: rgba(6, 22, 40, .84); border: 2px solid #ffd77a; border-radius: 12px; padding: 8px 12px; }
  #board h3 { margin: 0 0 4px; font-size: 15px; color: #ffd77a; letter-spacing: .06em; }
  /* 사운드 버튼 (시작 화면 위에도 보이도록) */
  #soundBtns { position: fixed; right: 8px; top: calc(var(--app-w) * 0.103 + 6px); z-index: 25; display: flex; gap: 6px; }
  #soundBtns button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid #7fb6e0; background: rgba(4,22,40,.72); color: #cfe3f5; font-size: 15px; cursor: pointer; line-height: 1; }
  #soundBtns button.off { opacity: .45; text-decoration: line-through; }
  /* 공지 팝업 */
  #notice { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; background: rgba(2, 10, 20, .7); padding: 20px; }
  #notice.show { display: flex; }
  #notice .card { width: min(92%, 360px); background: linear-gradient(#0d2a48, #071a2e); border: 2px solid #8fd3ff; border-radius: 16px; padding: 18px 16px 14px; box-shadow: 0 0 30px #2b9dff66; text-align: center; }
  #notice h3 { margin: 0 0 10px; font-size: 20px; color: #ffd77a; }
  #notice .body { font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.6; color: #e6f2ff; white-space: pre-line; text-align: left; }
  #notice .foot { display: flex; flex-direction: column; gap: 8px; align-items: center; margin-top: 14px; }
  #notice label { font-family: system-ui, sans-serif; font-size: 12px; color: #a9c3da; display: flex; gap: 6px; align-items: center; }
  /* 가로 모드 안내 */
  #rotate { display: none; position: fixed; inset: 0; z-index: 50; background: #04101c; color: #cfe3f5; align-items: center; justify-content: center; text-align: center; font-family: system-ui, sans-serif; font-size: 16px; line-height: 1.7; padding: 20px; }
  @media (orientation: landscape) and (max-height: 520px) { #rotate { display: flex; } }
  #flash { position: absolute; inset: 0; pointer-events: none; background: #ff2a1a; opacity: 0; z-index: 4; }
  #toast { position: absolute; left: 50%; top: 12%; transform: translateX(-50%); padding: 6px 14px; background: rgba(0,0,0,.6); border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 6; font-family: system-ui, sans-serif; }
  #langBtn { position: fixed; left: 8px; top: calc(var(--app-w) * 0.103 + 6px); z-index: 25; height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #7fb6e0; background: rgba(4,22,40,.72); color: #cfe3f5; font-family: system-ui, sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; }
  #mute { position: absolute; right: 8px; top: 8px; z-index: 6; width: 38px; height: 38px; border-radius: 50%; border: 1px solid #7fb6e0; background: rgba(4,22,40,.7); color: #cfe3f5; font-size: 16px; cursor: pointer; }

  /* ---------- 새 버전: 점령전 · 프로필 ---------- */
  .fdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
  .war { width: min(92%, 380px); background: rgba(6, 22, 40, .84); border: 2px solid #8fd3ff; border-radius: 14px; padding: 10px 12px 8px; }
  .war h3 { margin: 0 0 6px; font-size: clamp(14px, calc(var(--app-w) * 0.042), 18px); color: #bfe6ff; letter-spacing: .04em; }
  .war-map { display: block; width: 100%; border-radius: 10px; border: 1px solid rgba(160,220,255,.4); background: #061c33; }
  .war-row { display: grid; grid-template-columns: 22px 1fr auto 6.5em; gap: 8px; align-items: center; font-family: system-ui, sans-serif; font-size: 13px; padding: 5px 4px; border-top: 1px solid rgba(255,255,255,.07); text-align: left; }
  .war-row:first-child { border-top: 0; margin-top: 4px; }
  .war-row.mine { background: rgba(255,255,255,.08); border-radius: 8px; }
  .war-row img { width: 22px; height: 22px; display: block; }
  .war-row .pct { font-family: 'Orbitron', sans-serif; font-weight: 800; color: #fff; }
  .war-row .pts { font-family: 'Orbitron', sans-serif; font-size: 11px; color: #a9c3da; text-align: right; }
  #testBadge { width: min(92%, 380px); font-family: system-ui, sans-serif; font-size: 11px; color: #ffe9a8; background: rgba(60,40,0,.6); border: 1px dashed #ffd77a; border-radius: 10px; padding: 5px 8px; }
  #regRow { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; }
  #profLine { font-family: system-ui, sans-serif; font-size: 14px; color: #fff; display: flex; align-items: center; gap: 6px; }
  #profLine img { width: 18px; height: 18px; }
  #regNote { font-family: system-ui, sans-serif; font-size: 12px; color: #a9c3da; }
  .link { background: none; border: 0; color: #8fd3ff; font-family: system-ui, sans-serif; font-size: 12px; text-decoration: underline; cursor: pointer; padding: 4px; }
  .btn:disabled { opacity: .5; }
  #profile { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; background: rgba(2, 10, 20, .8); padding: 14px; }
  #profile.show { display: flex; }
  #profile .card { width: min(100%, 380px); max-height: 100%; overflow-y: auto; background: linear-gradient(#0d2a48, #071a2e); border: 2px solid #8fd3ff; border-radius: 16px; padding: 14px; text-align: center; touch-action: pan-y; }
  #profile h3 { margin: 0 0 8px; font-size: 18px; color: #ffd77a; }
  #profile .lab { font-family: system-ui, sans-serif; font-size: 12px; color: #a9c3da; margin: 10px 0 6px; text-align: left; }
  #profile input.name { width: 100%; user-select: text; -webkit-user-select: text; }
  #flagGrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  #flagGrid button { font-size: 24px; line-height: 1; padding: 7px 0; border-radius: 10px; border: 2px solid transparent; background: rgba(255,255,255,.07); cursor: pointer; }
  #flagGrid button.on { border-color: #ffd77a; background: rgba(255,215,122,.2); }
  #facGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  #facGrid button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px; border-radius: 12px; border: 2px solid transparent; background: rgba(255,255,255,.07); color: #fff; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; }
  #facGrid button img { width: 44px; height: 44px; }
  #facGrid button.on { border-color: #fff; background: rgba(255,255,255,.18); }
  #facGrid.locked button:not(.on) { opacity: .3; }
  #profile .foot { display: flex; gap: 8px; justify-content: center; margin-top: 14px; }
  #profile .foot .btn { min-width: 0; flex: 1; padding: 12px 8px; }
  #toast { position: fixed; z-index: 60; top: 14%; max-width: calc(var(--app-w) * 0.86); }
  #visits { display: none; }
  img.flag { height: 1em; width: auto; border-radius: 2px; vertical-align: -0.12em; box-shadow: 0 0 0 1px rgba(255,255,255,.25); }
  #flagGrid button img.flag { height: 24px; display: block; margin: 0 auto; }
  /* 시작 화면 다듬기: 시작 버튼 축소, TOP 10 을 촘촘하게 */
  #startOverlay .spacer { flex: 0 0 31vh; min-height: 190px; }
  .start-btn { width: min(72%, 290px); padding: 10px 16px; border-radius: 12px; gap: 10px; }
  .start-btn .t1 { font-size: clamp(19px, calc(var(--app-w) * 0.06), 26px); }
  .start-btn .arrow { font-size: 18px; }
  #hall { padding: 8px 12px 6px; }
  #hall h3 { font-size: clamp(14px, calc(var(--app-w) * 0.042), 18px); }
  ul.lb .lb-name { text-align: left; }
  #hall ul.lb li, #board ul.lb li { padding: 2px 4px; font-size: 12.5px; }
  /* 부제 */
  #subtitle { display: flex; align-items: center; gap: 10px; margin: -2px 0 2px; font-family: 'Orbitron', system-ui, sans-serif; font-weight: 800; font-size: clamp(20px, calc(var(--app-w) * 0.066), 30px); letter-spacing: .3em; padding-left: .3em; white-space: nowrap;
    background: linear-gradient(#fff6c9 10%, #ffd24a 45%, #c9820e 80%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 1px rgba(60, 28, 0, .55);
    filter: drop-shadow(0 2px 0 #3a1c00) drop-shadow(0 0 10px rgba(0, 20, 50, .9)); }
  #subtitle::before, #subtitle::after { content: ''; width: 28px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, transparent, #ffd24a); }
  #subtitle::after { transform: scaleX(-1); margin-left: -.3em; }
  /* 새 타이틀 그림 (SAVE THE OCEAN · DEPTH WAR) — 로고가 화면 위 41% 를 차지 */
  #startOverlay { background: #04101c url(assets/title2.jpg) center top / 100% auto no-repeat; }
  #startOverlay .spacer { flex: 0 0 calc(var(--app-w) * 0.75); min-height: 0; }
  /* ---------- 오래된 WebView(Chrome 87 이하) 대비: aspect-ratio · inset · flex gap 이 없을 때의 대체 배치 ---------- */
  @supports not (aspect-ratio: 1 / 1) {
    #app, .overlay, #game, #flash, #notice, #rotate, #profile, #hud .hp-bar { top: 0; right: 0; bottom: 0; left: 0; }
    #hud { height: calc(var(--app-w) * 0.1031); }
    #panel { height: calc(var(--app-w) * 0.2572); }
    #hudDrill { width: calc(var(--app-w) * 0.0866); }
    .zone { width: calc(var(--app-w) * 0.218); }
    .zone.bomb { width: calc(var(--app-w) * 0.181); flex: 0 0 auto; }
    #panel:not(.one) .zone.left, #panel:not(.one) .zone.right { width: auto; }
    #panel:not(.one) .zone.bomb { width: calc(var(--app-w) * 0.217); }
    #panel .buttons > * + * { margin-left: 1.5%; }
    .overlay > * + * { margin-top: 10px; }
    .row > * + *, #profLine > * + *, .start-btn > * + *, #profile .foot > * + * { margin-left: 8px; }
    #soundBtns button + button { margin-left: 6px; }
    #regRow > * + *, #recordBox > * + *, #notice .foot > * + * { margin-top: 8px; }
    #facGrid button > * + * { margin-top: 4px; }
  }
  /* ---------- 한 화면 배치: 스크롤 없이 탭으로 (점령전 / TOP 10) ---------- */
  #startOverlay { overflow: hidden; gap: 8px; padding: 0 12px max(6px, env(safe-area-inset-bottom)); }
  #startOverlay::before { height: 62%; }
  .start-btn { flex: 0 0 auto; }
  .tabs { width: min(100%, 420px); flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; background: rgba(6, 22, 40, .88); border: 2px solid #8fd3ff; border-radius: 14px; overflow: hidden; }

  .over-head .big { font-family: 'Orbitron', system-ui, sans-serif; font-weight: 800; font-size: clamp(22px, calc(var(--app-w) * 0.07), 32px); color: #ffc93c; text-shadow: 0 0 10px #ff9d0088; }

  @supports not (aspect-ratio: 1 / 1) {
    .over-head > * + *, .prow > * + *, .over-btns > * + *, .war-row .top > * + * { margin-left: 6px; }

  .start-btn .t1 { font-size: clamp(16px, calc(var(--app-w) * 0.05), 22px); }

  /* 언어·소리 버튼은 화면 모서리가 아니라 게임 상자 기준으로 놓는다 (PC 등 넓은 화면) */
  #langBtn { left: calc(50% - var(--app-w) / 2 + 8px); top: calc(var(--app-top, 0px) + var(--app-w) * 0.103 + 6px); }

</head>
<body>
<div id="rotate">📱<br><span data-i18n="rotate">세로로 돌려주세요</span><br><small data-i18n="rotate.sub">이 게임은 세로 화면 전용입니다</small></div>

</div>

    <div id="facGrid"></div>
    <button class="link" id="acctDelete" style="display:none; margin-top:10px; color:#ff9a8f" data-i18n="acct.delete">계정 삭제</button>
    <div class="foot">
      <button class="btn red" id="profCancel" data-i18n="prof.cancel">취소</button>
      <button class="btn" id="profOk" data-i18n="prof.ok">저장</button>
    </div>
  </div>
</div>
<div id="soundBtns">
  <button id="bgmBtn" data-i18n-label="sound.bgm" aria-label="배경음 켜기/끄기">🌊</button>
  <button id="sfxBtn" data-i18n-label="sound.sfx" aria-label="효과음 켜기/끄기">💥</button>
</div>
<button id="langBtn" data-i18n="lang">🌐 EN</button>
<div id="app">
  <div id="hud">
    <div class="hp-wrap"><div class="hp-bar"><div class="hp-fill" id="hpFill"></div></div></div>
    <div class="hp-text" id="hpText">100%</div>
    <div class="score" id="scoreText">000000</div>
    <div class="bombs"><span class="n" id="bombN">5</span><span>/</span><span id="bombMax">5</span></div>
    <div id="hudDrill" style="position:absolute; left:72.5%; top:8%; height:84%; aspect-ratio:1/1; display:none; border-radius:50%; background:#0b1a2b; box-shadow:0 0 0 1px #3a5a7a inset; overflow:hidden"><img src="assets/icon_drill.png" alt="" style="height:100%; display:block; margin:0 auto; filter: drop-shadow(0 0 3px #ffb347);"></div>
  </div>

    <canvas id="game"></canvas>
    <div id="flash"></div>
    <button class="ctl" id="ctlMode" data-i18n-label="aria.ctl" aria-label="조작 방식 전환">🤲 양손</button>
    <button class="ctl" id="ctlHand" data-i18n-label="aria.hand" aria-label="사용 손 전환">▶ 우수</button>
    <div id="toast"></div>

    <div class="overlay" id="startOverlay">
      <div id="visits" data-i18n="visits.empty">오늘 – · 누적 –</div>
      <div class="spacer"></div>
      <button class="start-btn" id="startBtn" data-i18n-label="aria.start" aria-label="작전 시작"><span class="arrow">▶</span><span class="t1" data-i18n="start">작전 시작</span></button>
      <div class="tabs" id="hall">
        <div class="tabbar"><button type="button" class="on" data-tab="war" data-i18n="tab.war">🌊 점령전</button><button type="button" data-tab="top" data-i18n="tab.top">🏆 주간 TOP 10</button><button type="button" data-tab="hall" data-i18n="tab.hall">👑 명예의 전당</button></div>
        <div class="pane on" data-pane="war" id="warStart"></div>
        <div class="pane" data-pane="top" id="top3"><div class="note" data-i18n="loading">불러오는 중...</div></div>
        <div class="pane hall-pane" data-pane="hall"></div>
      </div>

      <div class="credit" data-i18n="credit">Made with AI</div>
    </div>

      <div class="over-head"><h2 data-i18n="over">침몰…</h2><div class="big" id="finalScore">0</div></div>

          <div id="regNote"></div>
        </div>
      </div>
      <div class="row" id="loginRow" style="display:none">
        <div class="note" data-i18n="over.needLogin">기록을 올리려면 로그인이 필요해요.</div>
        <button class="btn login apple" id="loginBtn"> Apple로 로그인</button>
      </div>
      <div class="row over-btns">
        <button class="btn" id="regBtn" data-i18n="reg.btn">🌊 기록 올리기</button>

        <div class="pane on" data-pane="war" id="warOver"></div>
        <div class="pane" data-pane="top" id="top10"><div class="note" data-i18n="loading">불러오는 중...</div></div>
        <div class="pane hall-pane" data-pane="hall"></div>
      </div>
    </div>
  </div>

  <div id="panel">
    <div class="buttons">
      <div class="zone left"  id="zLeft"  role="button" data-i18n-label="aria.left" aria-label="왼쪽으로 이동"></div>

<!-- 테스트 빌드: 스크립트 오류를 화면 아래에 표시 (원인 파악용, 출시 전 제거) -->
<script>
  window.addEventListener('error', function (e) {
    if (e.target && e.target.getAttribute && e.target.getAttribute('data-opt')) return;   // 없어도 되는 온라인 자료
    var b = document.getElementById('__errbox');
    if (!b) { b = document.createElement('div'); b.id = '__errbox'; b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99;pointer-events:none;background:rgba(120,0,0,.92);color:#fff;font:11px/1.4 monospace;padding:6px 8px;max-height:40%;overflow:auto;white-space:pre-wrap'; b.textContent = 'WebView: ' + ((navigator.userAgent.match(/Chrome\/[\d.]+|Version\/[\d.]+/) || [''])[0]) + '\n'; document.body.appendChild(b); }
    b.textContent += (e.message || 'load error') + ' @ ' + ((e.filename || (e.target && (e.target.src || e.target.href)) || '').split('/').pop()) + ':' + (e.lineno || '') + '\n';
  }, true);
</script>
<!-- 앱 내장 라이브러리 (CI 가 vendor/ 에 채움 — 오프라인에서도 로드됨) -->

<!-- 명예의 전당(지난 주간 1위·점령전 우승 세력)은 웹의 season.js / war-seasons.js 를 온라인일 때만 받아온다 -->
<script>['season.js', 'war-seasons.js'].forEach(function (f) { var s = document.createElement('script'); s.async = true; s.setAttribute('data-opt', '1'); s.src = 'https://bluecfdc-spec.github.io/save-the-ocean/' + f + '?d=' + new Date().toISOString().slice(0, 10); s.onload = function () { if (window.LB) document.querySelectorAll('.hall-pane').forEach(function (el) { LB.renderSeasons(el); }); }; document.head.appendChild(s); });</script>

<script>
  // iOS 더블탭 확대/핀치 확대 방지 (버튼 연타 시 화면이 커지는 문제)
  (function () {
    let last = 0;
    document.addEventListener('touchend', function (e) {
      const now = Date.now();
      if (now - last < 350) e.preventDefault();
      last = now;
    }, { passive: false });
    document.addEventListener('touchstart', function (e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
  })();
</script>
