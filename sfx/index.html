<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>효과음 고르기</title>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
<style>body{margin:0;background:#0b0d0a;color:#f3efe0;font:16px 'Do Hyeon',system-ui;padding:14px 12px 120px}h1{color:#ffd451;font-size:22px;margin:0 0 6px}h2{color:#9be37a;font-size:18px;margin:18px 0 6px;border-bottom:1px solid #3a3e32}
.it{background:#15170f;border:1px solid #3a3e32;border-radius:10px;padding:10px;margin:8px 0}.it .nm{font-size:17px;color:#fff}.it .pr{font-size:12px;color:#8a9477;margin:2px 0 8px}
.c{display:flex;align-items:center;gap:8px;margin:4px 0}.c button{font:16px 'Do Hyeon';padding:8px 14px;border-radius:8px;border:1px solid #6b7a52;background:#1b1d16;color:#fff}.c label{display:flex;align-items:center;gap:6px}
.c input{width:22px;height:22px}#out{position:fixed;left:0;right:0;bottom:0;background:#1b1d16;border-top:2px solid #ffd451;padding:10px 12px}#out textarea{width:100%;height:60px;background:#0b0d0a;color:#9be37a;border:1px solid #3a3e32;font:13px monospace}
.sm{color:#8a9477;font-size:13px}</style></head><body>
<h1>효과음 고르기</h1><div class="sm">▶ 눌러 듣고, 마음에 드는 후보 하나에 체크. 아래 상자의 글을 복사해서 Claude에게 붙여 주세요.</div>
<div id="list">불러오는 중…</div>
<div id="out"><div class="sm">선택 결과 (자동 갱신)</div><textarea id="sel" readonly></textarea></div>
<script>
fetch('manifest.json?t='+Date.now()).then(r=>r.json()).then(m=>{
  const L=document.getElementById('list'); L.innerHTML=''; const games={}; Object.values(m).forEach(it=>{(games[it.game]=games[it.game]||[]).push(it)});
  const saved=JSON.parse(localStorage.getItem('sfxpick')||'{}');
  for(const g of ['공통','탱크','스카이','오션']){ if(!games[g])continue; const h=document.createElement('h2'); h.textContent=g; L.appendChild(h);
    games[g].sort((a,b)=>a.num.localeCompare(b.num)).forEach(it=>{ const id=it.game+'_'+it.num; const d=document.createElement('div'); d.className='it';
      d.innerHTML='<div class="nm">'+id+' · '+it.name+'</div><div class="pr">'+it.prompt+'</div>';
      it.files.forEach((f,i)=>{ const c=document.createElement('div'); c.className='c'; const b=document.createElement('button'); b.textContent='▶ 후보 '+(i+1); const a=new Audio('../'+f); b.onclick=()=>{a.currentTime=0;a.play()};
        const lb=document.createElement('label'); const r=document.createElement('input'); r.type='radio'; r.name=id; r.value=f; r.checked=saved[id]===f; r.onchange=()=>{saved[id]=f;localStorage.setItem('sfxpick',JSON.stringify(saved));out()}; lb.appendChild(r); lb.appendChild(document.createTextNode('이걸로')); c.appendChild(b); c.appendChild(lb); d.appendChild(c); });
      const c2=document.createElement('div'); c2.className='c'; const lb2=document.createElement('label'); const r2=document.createElement('input'); r2.type='radio'; r2.name=id; r2.value='다시'; r2.checked=saved[id]==='다시'; r2.onchange=()=>{saved[id]='다시';localStorage.setItem('sfxpick',JSON.stringify(saved));out()}; lb2.appendChild(r2); lb2.appendChild(document.createTextNode('다 별로 — 다시 뽑기')); c2.appendChild(lb2); d.appendChild(c2);
      L.appendChild(d); });
  }
  function out(){ document.getElementById('sel').value=Object.entries(saved).map(([k,v])=>k+' = '+(v==='다시'?'다시':v.split('/').pop())).join('\n'); } out();
});
</script></body></html>
