<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>탱크럼블 · 시험판</title>
<link rel="icon" href="assets/v2/icon_64.png">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Orbitron:wght@800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #120d08; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  body { position: fixed; inset: 0; width: 100%; }
  #c { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  .ov { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 8px; padding: 16px 16px max(16px, env(safe-area-inset-bottom)); box-sizing: border-box; color: #fff; text-align: center; font-family: 'Black Han Sans', 'Do Hyeon', sans-serif; }
  .hidden { display: none !important; }
  /* 시작 화면(title4): 그림은 절대 자르지 않음. 폭 = 화면 폭(로고 끝이 그림 높이 61% → 아래 버튼 250px 위에 오도록, 화면이 짧으면 그만큼 작게). 그림 아래는 같은 진흙색으로 이어 붙이고, 양옆이 남으면 흐린 그림으로 채움 */
  #title { --iw: min(100vw, calc((100vh - 250px) / 0.915)); --iw: min(100vw, calc((100dvh - 250px) / 0.915)); --ih: calc(var(--iw) * 1.5); isolation: isolate; background: rgb(34,24,22); }
  #title::before { content: ''; position: absolute; inset: -30px; z-index: -1; background: url(assets/v2/title4.jpg?v=1) center top / cover no-repeat, rgb(34,24,22); filter: blur(18px) brightness(.5); }
  #title::after { content: ''; position: absolute; left: 50%; top: 0; width: var(--iw); height: 100%; transform: translateX(-50%); z-index: -1; background: linear-gradient(to bottom, rgba(34,24,22,0) calc(var(--ih) * 0.9), rgb(34,24,22) calc(var(--ih) - 1px)), url(assets/v2/title4.jpg?v=1) center top / 100% auto no-repeat, rgb(34,24,22); }
  .tag { font-family: 'Orbitron', sans-serif; font-size: 13px; letter-spacing: 3px; color: #ffe066; text-shadow: 0 0 8px #ff9a1f; }
  .pick { font-size: 18px; color: #ffd451; text-shadow: 0 2px 0 #000; }
  .facs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: min(92vw, 420px); }
  .fac { border-style: solid; border-color: transparent; border-width: 7px; border-image: url(assets/v2/btn_check_off.png?v=1) 32 fill / 7px stretch; background: none; color: #fff; font: 18px 'Black Han Sans', sans-serif; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 2px 4px; filter: brightness(.6) saturate(.6); text-shadow: 0 2px 0 #000; }
  .fac img { width: 30px; height: 30px; }
  .fac.on { filter: brightness(1.05) drop-shadow(0 0 8px var(--fc)); }
  .btn { border-style: solid; border-color: transparent; border-width: 10px 26px; border-image: url(assets/v2/plate_gold.png?v=1) 30 50 fill / 10px 26px stretch; background: none; font: 26px 'Black Han Sans', sans-serif; letter-spacing: 2px; color: #2c1800; text-shadow: 0 1px 0 rgba(255,240,190,.95); padding: 2px 0; width: min(92vw, 420px); filter: drop-shadow(0 6px 8px rgba(0,0,0,.7)); }
  .btn:active { transform: translateY(2px); }
  .rules { width: min(92vw, 420px); background: rgba(8,6,3,.82); border: 1px solid rgba(214,170,70,.55); border-radius: 10px; padding: 8px 12px; font-family: 'Do Hyeon', sans-serif; font-size: 19px; line-height: 1.45; text-align: left; padding: 6px 10px; }
  .rules em { font-style: normal; color: #ffe066; text-shadow: 0 0 8px rgba(255,200,60,.8); }
  #end { background: radial-gradient(ellipse at 50% 35%, rgba(255,190,60,.3), rgba(8,10,6,.94) 65%), url(assets/v2/keyart.jpg) center/cover no-repeat; justify-content: center; gap: 10px; }
  #end.lose { background: radial-gradient(ellipse at 50% 35%, rgba(255,60,40,.25), rgba(8,6,6,.95) 65%), url(assets/v2/keyart.jpg) center/cover no-repeat; }
  #endT { font-size: 58px; letter-spacing: 4px; color: #ffd451; text-shadow: 0 0 30px #ff9a1f, 0 4px 0 #5a3b00; }
  #end.lose #endT { color: #ff6a5a; text-shadow: 0 0 24px #a01000, 0 4px 0 #300; }
  #endS { font-size: 28px; } #endB { font-size: 48px; color: #9be37a; text-shadow: 0 0 18px #4caf2a, 0 3px 0 #000; } #end.lose #endB { display: none; }
  #endScore { font-size: 32px; color: #ffe9a8; }
  #cards { background: rgba(6,8,4,.82); justify-content: center; gap: 14px; }
  #cards h3 { margin: 0; font-size: 30px; color: #ffd451; text-shadow: 0 0 16px #ff9a1f, 0 3px 0 #000; }
  #cardList { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: min(94vw, 440px); }
  .card { border: 0; padding: 14px 6px; border-radius: 12px; background: linear-gradient(160deg, #3a2f1a, #15110a); box-shadow: 0 0 0 2px #d6aa46, 0 0 18px rgba(255,190,60,.35); color: #fff; font-family: 'Black Han Sans', sans-serif; display: flex; flex-direction: column; gap: 8px; align-items: center; animation: cardIn .35s ease-out both; }
  .card b { font-size: 19px; color: #ffe066; font-weight: 400; } .card span { font: 15px 'Do Hyeon', sans-serif; color: #e8e0c8; } .card i { font-style: normal; font-size: 17px; color: #9be37a; }
  .card:nth-child(2) { animation-delay: .08s; } .card:nth-child(3) { animation-delay: .16s; } .card.full { filter: saturate(.4); }
  .card:active { transform: scale(.96); }
  @keyframes cardIn { from { opacity: 0; transform: translateY(24px) scale(.9); } to { opacity: 1; transform: none; } }
  .btn.iron { border-image: url(assets/v2/plate_iron.png?v=1) 30 50 fill / 10px 26px stretch; color: #f3efe0; text-shadow: 0 2px 0 #000; font-size: 22px; letter-spacing: 0; }
  .btn.go { font-size: 25px; padding: 9px 0; }
  .row2 .btn.iron { padding: 9px 0; font-size: 21px; }
  .btn.iron { white-space: nowrap; padding: 0; font-size: 19px; display: flex; align-items: center; justify-content: center; }
  .btn.tut { width: min(92vw, 420px); font-size: 20px; }
  #tutExit { position: fixed; top: max(8px, env(safe-area-inset-top)); right: 8px; z-index: 50; border-style: solid; border-color: transparent; border-width: 8px 20px; border-image: url(assets/v2/plate_iron.png?v=1) 30 50 fill / 8px 20px stretch; background: none; color: #fff; font: 20px 'Black Han Sans', sans-serif; padding: 2px 4px; text-shadow: 0 2px 0 #000; filter: drop-shadow(0 4px 6px rgba(0,0,0,.7)); }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="title" class="ov">
  <div class="pick">당신의 세력을 선택하세요</div>
  <div class="facs">
    <button class="fac" data-f="surge" style="--fc:#4fd8ff"><img src="assets/v2/f_surge.png" alt="">서지</button>
    <button class="fac" data-f="gale" style="--fc:#c58bff"><img src="assets/v2/f_gale.png" alt="">게일</button>
    <button class="fac" data-f="solar" style="--fc:#ffd451"><img src="assets/v2/f_solar.png" alt="">솔라</button>
  </div>
  <button id="tutBtn" class="btn iron tut">📖 튜토리얼</button>
  <button id="go" class="btn go">출격!</button>
</div>

<div id="cards" class="ov hidden"><h3>강화 카드 — 하나 고르세요</h3><div id="cardList"></div></div>

<div id="end" class="ov hidden">
  <div id="endT">VICTORY</div>
  <div id="endS">스테이지 1 클리어!</div>
  <div id="endB">+2,000</div>
  <div id="endScore">점수 0</div>
  <button id="endBtn" class="btn">다음 스테이지 ▶</button>
</div>

<script>/* 블록을 끌 때 화면이 같이 밀리지 않게 */ document.addEventListener('touchmove', function (e) { if (e.target && e.target.id === 'c') e.preventDefault(); }, { passive: false }); document.addEventListener('touchstart', function (e) { if (e.target && e.target.id === 'c') e.preventDefault(); }, { passive: false }); document.addEventListener('gesturestart', function (e) { e.preventDefault(); });</script>
<button id="tutExit" class="hidden">✕ 나가기</button>
<script src="sfx.js?v=41"></script>
<script src="next.js?v=51"></script>
</body>
</html>
