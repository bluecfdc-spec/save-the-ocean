<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TANK RUMBLE (test)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0b0d0a; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: 'Orbitron', system-ui, sans-serif; }
  #c { display: block; background: #0b0d0a; }
  #ov { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(ellipse at 50% 30%, #2b3321 0%, #0b0d0a 70%); color: #f3efe0; text-align: center; padding: 24px; box-sizing: border-box; }
  #ov h1 { font-size: 34px; letter-spacing: 3px; margin: 0; color: #ffd451; text-shadow: 0 0 18px #ff9a1f88, 0 2px 0 #5a3b00; }
  #ov h1 small { display: block; font-size: 12px; color: #b9c7a0; letter-spacing: 6px; margin-top: 6px; }
  #ov p { font: 500 13px/1.7 system-ui, sans-serif; max-width: 340px; margin: 0; color: #d7dcc6; }
  #ov .score { font-size: 30px; color: #fff; }
  .btn { font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 18px; letter-spacing: 2px; padding: 14px 34px; border-radius: 12px; border: 2px solid #ffcf4a; color: #2a1a00; background: linear-gradient(#ffe284, #e8a21a); box-shadow: 0 4px 0 #8a5a00, 0 8px 18px #0008; cursor: pointer; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #8a5a00; }
  .btn.sub { font-size: 14px; padding: 10px 22px; background: linear-gradient(#cfd8c0, #8d9a7a); border-color: #dfe6d2; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ov">
  <h1>TANK RUMBLE<small>TEST BUILD</small></h1>
  <p id="ovText">블록을 끌어다 놓아 줄을 지우면 연료·정찰·미사일을 얻는다.<br>연료로 탱크를 옮기고, 정찰로 최전방 병사를 찾고, 같은 세로줄이면 미사일로 잡아라.<br>40초마다 적이 한 줄씩 밀고 내려오고, 최전방 병사를 다 잡으면 한 줄 물러난다.</p>
  <div id="ovScore" class="score hidden"></div>
  <button id="startBtn" class="btn">START</button>
</div>
<script src="tank.js?v=3"></script>
</body>
</html>
