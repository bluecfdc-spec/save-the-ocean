# 네이티브 프로젝트(android/, ios/) 최초 생성 — 한 번만 실행되며 결과를 app 브랜치에 커밋합니다.
# 자동: android/ 폴더가 없을 때 push 되면 실행. 수동: Actions 탭 → "Bootstrap native projects" → Run workflow
name: Bootstrap native projects
on:
  push:
    branches: [app]
  workflow_dispatch:
permissions:
  contents: write
concurrency: bootstrap
jobs:
  bootstrap:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if already bootstrapped
        id: check
        run: |
          if [ -d android ] && [ -d ios ] && [ "${{ github.event_name }}" = "push" ]; then echo "skip=true" >> $GITHUB_OUTPUT; else echo "skip=false" >> $GITHUB_OUTPUT; fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip == 'false'
        with: { node-version: 22 }
      - name: Bootstrap
        if: steps.check.outputs.skip == 'false'
        run: |
          set -o pipefail
          bash scripts/bootstrap-native.sh 2>&1 | tee ci-logs-bootstrap.log
      - name: Save log on failure (커밋해서 확인용)
        if: failure()
        run: |
          mkdir -p ci-logs && mv ci-logs-bootstrap.log ci-logs/bootstrap.log || true
          cp ~/.npm/_logs/*.log ci-logs/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-logs && git commit -m "ci: bootstrap failure log [skip ci]" && git push || true
      - name: Commit native projects
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f ci-logs-bootstrap.log; rm -rf ci-logs
          git add -A
          git commit -m "chore: bootstrap native projects (android/ios) + vendor bundles" || echo "nothing to commit"
          git push
