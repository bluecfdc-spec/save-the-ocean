# iOS: 서명한 빌드를 만들어 TestFlight(App Store Connect)로 올린다 — Mac 없이 GitHub 의 macOS 서버에서 실행
#  필요한 저장소 시크릿 (Settings → Secrets and variables → Actions):
#   · ASC_KEY_P8      : App Store Connect API 키 파일(AuthKey_XXXX.p8)의 내용 전체
#  필요한 저장소 변수 (같은 화면의 Variables 탭) 또는 아래 env 기본값:
#   · ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID
#  실행: ios/testflight-trigger 파일을 고쳐서 push
name: iOS TestFlight
on:
  workflow_dispatch:
  # ios/testflight-trigger 파일이 바뀌어 push 되면 실행 (수동 실행 버튼은 기본 브랜치에 있는 워크플로에만 보여서)
  push:
    branches: [app]
    paths: ['ios/testflight-trigger']
permissions:
  contents: write
env:
  ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
  ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
  APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: 설정값 읽기 (ios/signing.env 가 있으면 사용)
        run: |
          if [ -f ios/signing.env ]; then
            while IFS='=' read -r k v; do case "$k" in ASC_KEY_ID|ASC_ISSUER_ID|APPLE_TEAM_ID) if [ -n "$v" ]; then echo "$k=$v" >> "$GITHUB_ENV"; fi;; esac; done < ios/signing.env
          fi
      - name: 열쇠 확인
        env: { P8: "${{ secrets.ASC_KEY_P8 }}" }
        run: |
          [ -n "$P8" ] || { echo "::error::시크릿 ASC_KEY_P8 이 없습니다"; exit 1; }
          [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] || { echo "::error::ASC_KEY_ID / ASC_ISSUER_ID 가 비어 있습니다"; exit 1; }
          mkdir -p "$RUNNER_TEMP/keys"
          # 파일 내용을 그대로 붙였든 base64 로 붙였든 받아준다
          if printf '%s' "$P8" | grep -q "BEGIN PRIVATE KEY"; then printf '%s\n' "$P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          else printf '%s' "$P8" | tr -d ' \n\r' | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"; fi
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" || { echo "::error::ASC_KEY_P8 내용이 올바른 .p8 형식이 아닙니다"; exit 1; }
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
      - name: 서명 준비 (배포 인증서 + 프로비저닝 프로파일)
        run: |
          python3 -m pip install --quiet --break-system-packages 'pyjwt[crypto]' requests cryptography 2>/dev/null || python3 -m pip install --quiet 'pyjwt[crypto]' requests cryptography
          python3 scripts/ios-signing.py
      - name: 새로 만든 인증서를 저장소에 보관 (암호화된 파일)
        run: |
          if [ -n "$SIGNING_CHANGED" ]; then
            git config user.name "signing-bot"; git config user.email "signing-bot@users.noreply.github.com"
            git add ios/signing/dist.p12.enc
            git commit -m "ios: 배포 인증서 보관 (암호화)" && git pull --rebase -q && git push || echo "::warning::인증서 파일을 저장소에 올리지 못했습니다"
          fi
      - name: 키체인에 인증서 넣기
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"; KP=$(uuidgen)
          security create-keychain -p "$KP" "$KC"; security set-keychain-settings -lut 21600 "$KC"; security unlock-keychain -p "$KP" "$KC"
          security import "$P12_PATH" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security || { echo "::error::인증서를 키체인에 넣지 못했습니다"; exit 1; }
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC" | tail -2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Web build + cap sync
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx cap sync ios
      - name: 프로젝트를 수동 서명으로 전환 (앱 타깃만)
        working-directory: ios/App
        run: |
          # 앱 타깃의 설정만 바꾼다. 명령줄에서 주면 Capacitor 패키지 타깃에도 적용돼 오류가 난다.
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual; CODE_SIGN_IDENTITY = \"Apple Distribution\"; \"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"Apple Distribution\"; DEVELOPMENT_TEAM = ${APPLE_TEAM_ID}; PROVISIONING_PROFILE_SPECIFIER = \"${PROFILE_NAME}\";/" App.xcodeproj/project.pbxproj
          grep -c "CODE_SIGN_STYLE = Manual" App.xcodeproj/project.pbxproj
      - name: Archive (배포 서명)
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" > "$RUNNER_TEMP/archive.log" 2>&1 || true
          grep -E "ARCHIVE (SUCCEEDED|FAILED)" "$RUNNER_TEMP/archive.log" || true
          grep -q "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/archive.log" || { echo "❌ archive 실패" >> $GITHUB_STEP_SUMMARY; grep -E "error:|error " "$RUNNER_TEMP/archive.log" | sort -u | head -12 | while read -r l; do echo "::error::${l:0:900}"; done; tail -4 "$RUNNER_TEMP/archive.log" | while read -r l; do echo "::notice::${l:0:500}"; done; exit 1; }
      - name: Upload to App Store Connect (TestFlight)
        working-directory: ios/App
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>com.bluecfdc.savetheocean</key><string>${PROFILE_NAME}</string></dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PL
          sed -i '' 's/^          //' "$RUNNER_TEMP/export.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log" | grep -E "error|Upload|EXPORT|Progress 100" || true
          if grep -qE "EXPORT SUCCEEDED|Upload succeeded" "$RUNNER_TEMP/export.log"; then echo "✅ TestFlight 업로드 완료 (build ${{ github.run_number }})" >> $GITHUB_STEP_SUMMARY
          else echo "❌ 업로드 실패" >> $GITHUB_STEP_SUMMARY; grep -iE "error" "$RUNNER_TEMP/export.log" | sort -u | head -12 | while read -r l; do echo "::error::${l:0:900}"; done; tail -5 "$RUNNER_TEMP/export.log" | while read -r l; do echo "::notice::${l:0:600}"; done; exit 1; fi
      - name: 열쇠 지우기
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"; security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
