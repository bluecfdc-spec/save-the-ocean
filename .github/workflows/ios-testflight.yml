# iOS: 서명한 빌드를 만들어 TestFlight(App Store Connect)로 올린다 — Mac 없이 GitHub 의 macOS 서버에서 실행
#  필요한 저장소 시크릿 (Settings → Secrets and variables → Actions):
#   · ASC_KEY_P8      : App Store Connect API 키 파일(AuthKey_XXXX.p8)의 내용 전체
#  필요한 저장소 변수 (같은 화면의 Variables 탭) 또는 아래 env 기본값:
#   · ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID
#  실행: GitHub → Actions → "iOS TestFlight" → Run workflow
name: iOS TestFlight
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
  ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
  APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: 설정값 읽기 (ios/signing.env 가 있으면 사용)
        run: |
          if [ -f ios/signing.env ]; then
            while IFS='=' read -r k v; do case "$k" in ASC_KEY_ID|ASC_ISSUER_ID|APPLE_TEAM_ID) [ -n "$v" ] && echo "$k=$v" >> "$GITHUB_ENV";; esac; done < ios/signing.env
          fi
      - name: 열쇠 확인
        env: { P8: "${{ secrets.ASC_KEY_P8 }}" }
        run: |
          [ -n "$P8" ] || { echo "::error::시크릿 ASC_KEY_P8 이 없습니다"; exit 1; }
          [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$APPLE_TEAM_ID" ] || { echo "::error::ASC_KEY_ID / ASC_ISSUER_ID / APPLE_TEAM_ID 가 비어 있습니다"; exit 1; }
          mkdir -p "$RUNNER_TEMP/keys"
          # 파일 내용을 그대로 붙였든 base64 로 붙였든 받아준다
          if printf '%s' "$P8" | grep -q "BEGIN PRIVATE KEY"; then printf '%s\n' "$P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          else printf '%s' "$P8" | tr -d ' \n\r' | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"; fi
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" || { echo "::error::ASC_KEY_P8 내용이 올바른 .p8 형식이 아닙니다"; exit 1; }
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Web build + cap sync
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx cap sync ios
      - name: Archive (자동 서명)
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning: .*(sign|provision)|ARCHIVE|Signing" || true
          grep -q "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/archive.log" || { echo "❌ archive 실패" >> $GITHUB_STEP_SUMMARY; grep -E "error:" "$RUNNER_TEMP/archive.log" | head -30 | tee -a $GITHUB_STEP_SUMMARY; exit 1; }
      - name: Upload to App Store Connect (TestFlight)
        working-directory: ios/App
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PL
          sed -i '' 's/^          //' "$RUNNER_TEMP/export.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log" | grep -E "error|Upload|EXPORT|Progress 100" || true
          if grep -qE "EXPORT SUCCEEDED|Upload succeeded" "$RUNNER_TEMP/export.log"; then echo "✅ TestFlight 업로드 완료 (build ${{ github.run_number }})" >> $GITHUB_STEP_SUMMARY
          else echo "❌ 업로드 실패" >> $GITHUB_STEP_SUMMARY; grep -iE "error" "$RUNNER_TEMP/export.log" | head -30 | tee -a $GITHUB_STEP_SUMMARY; exit 1; fi
      - name: 열쇠 지우기
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
